<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}｜一周一题</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="article">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 皮肤「记录纸与沥青」：浅色是计时记录纸的白底配墨线刻度，深色是沥青黑底配白线；唯一强调色是转速表红线的红。章号用速度的数量级 10¹…10⁶ km/h。 */
:root{
  --bg:#F5F3EC;--surface:#FBFAF6;--surface-2:#ECE9DF;
  --ink:#17181C;--ink-2:#3B3D44;--muted:#6C6F78;
  --line:#C8C6BC;--line-2:#E0DDD3;--grid:rgba(23,24,28,.07);
  --accent:#C8202E;--accent-ink:#A9131F;--wash:rgba(200,32,46,.09);--wash-2:rgba(200,32,46,.18);
  --band-bg:#17181C;--band-surface:#222327;--band-ink:#F1EFE8;--band-ink-2:#C9C7BE;--band-muted:#8E9097;--band-line:#3C3D44;--band-accent:#FF5A5A;
  --nav-h:50px;--gut:clamp(16px,3.2vw,40px);
  --serif:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC",serif;
  --sans:"Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
{{DARK_BLOCKS}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 14px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.85 var(--sans);font-variant-numeric:tabular-nums;overflow-x:hidden}
a{color:var(--accent-ink);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:900;margin:0;letter-spacing:.02em}
h4{font:700 14px/1.4 var(--sans);margin:26px 0 8px;color:var(--ink-2);letter-spacing:.14em}
p{margin:0 0 1em}
button{font-family:var(--sans)}
.wide{max-width:1240px;margin:0 auto;padding:0 var(--gut)}
.col{max-width:46em}
.small{font-size:13.5px;line-height:1.7;color:var(--muted)}
.fade{opacity:0;transform:translateY(10px);transition:opacity .55s ease,transform .55s ease}
.fade.in{opacity:1;transform:none}
.paper{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.num{font-variant-numeric:tabular-nums}
.conf{display:inline-block;font:500 11px/1 var(--sans);letter-spacing:.08em;padding:3px 6px;border:1px solid var(--line);color:var(--muted);vertical-align:2px;white-space:nowrap}
.conf.h{border-color:var(--ink);color:var(--ink)}
.conf.l{border-style:dashed}
.tag{display:inline-block;font:500 11.5px/1 var(--sans);letter-spacing:.1em;padding:4px 7px;background:var(--ink);color:var(--bg);white-space:nowrap}
.tag.claim{background:transparent;color:var(--accent-ink);border:1px solid var(--accent)}
.src{font-size:12.5px;line-height:1.7;color:var(--muted);margin:8px 0 0}
.src a{color:var(--muted)}
.src a:hover{color:var(--accent-ink)}

/* ---------- v2 卷首与论点（第 7 题 v3 的版面系统：字号只取 12/14/16/18/20/24/30/36/48/60/96/128，间距 4–96，字重 ≤700，缓动 cubic-bezier(.22,1,.36,1)，入场上升 32 px；背景不用渐变，卷首标题字除外）
   卷首是一张竖幅原片放进纯黑画布：横屏火箭在右侧 72%，手机竖屏火箭在右下，字压在夜空上，不加遮罩。 */
:root{--ease:cubic-bezier(.22,1,.36,1)}
.h3{position:relative;min-height:max(calc(100dvh - 36px),630px);display:flex;flex-direction:column;justify-content:center;overflow:hidden;background:#000;color:#fff;isolation:isolate}
.h3img{position:absolute;inset:0;margin:0;z-index:-1;background:#000}
.h3img picture{display:block;width:100%;height:100%}
.h3img img{display:block;width:100%;height:100%;object-fit:cover;object-position:72% 42%;transform:scale(1.06);transform-origin:72% 60%;animation:h3zoom 2.4s var(--ease) .1s forwards}
@keyframes h3zoom{to{transform:scale(1)}}
.h3in{width:100%;padding-top:48px;padding-bottom:176px}
.h3k{margin:0;font:500 14px/20px var(--sans);letter-spacing:.08em;color:rgba(255,255,255,.72)}
.h3t{margin:16px 0 0;font:700 128px/1 var(--serif);letter-spacing:-.01em;max-width:680px;background:linear-gradient(90deg,#FFFFFF 0%,#9B9B9B 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:nowrap}
.h3s{margin:24px 0 0;font:500 24px/32px var(--serif);letter-spacing:0;color:rgba(255,255,255,.9);max-width:680px}
.h3s span{display:block}
.h3a{margin:40px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;max-width:680px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 16px 12px 24px;border-radius:9999px;background:#fff;color:#0B0B0B;font:600 16px/24px var(--sans);text-decoration:none;transition:transform .3s var(--ease),background-color .3s var(--ease)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s var(--ease)}
.btn:hover{background:#ECEAE4}
.btn:hover svg{transform:translateY(2px)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid #FF4F4F;outline-offset:4px}
.h3p{font:400 14px/20px var(--sans);color:rgba(255,255,255,.72)}
.h3cap{position:absolute;right:24px;bottom:16px;margin:0;max-width:480px;font:400 12px/16px var(--sans);color:rgba(255,255,255,.56);text-align:right;text-wrap:balance}
.rise{opacity:0;transform:translateY(32px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rise.in{opacity:1;transform:none}
/* 论点：一句话，逐词「掠」进来——带一点横向拖影，像从窗外闪过的东西 */
.tagsec{position:relative;height:240vh;background:#000}
.tagsec.band,.h3.band{background:#000}
.tagstick{position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));display:flex;align-items:center}
/* 放不下（矮屏、手机）就不钉住，跟着页面走，词按位置点亮 */
.tagsec.flow{height:auto}.tagsec.flow .tagstick{position:static;height:auto;padding:96px 0}
.tagstick>.wide{width:100%}
.tagl{margin:0;font:700 60px/1.25 var(--serif);letter-spacing:-.01em;max-width:680px}
.tagl .ln{display:block}
.tagl .w{display:inline-block;color:rgba(241,239,232,.22);transition:color .5s var(--ease)}
.tagl .w.on{color:#F1EFE8;animation:whoosh .8s var(--ease)}
@keyframes whoosh{0%{transform:translateX(-32px);filter:blur(6px);color:#FF4F4F}50%{color:#FFB4AB}100%{transform:none;filter:none;color:#F1EFE8}}
.tagrest{margin:40px 0 0;max-width:820px;opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.tagrest.on{opacity:1;transform:none}
.tagrest>p{margin:0;max-width:680px;font:400 18px/32px var(--sans);color:#C9C7BE;text-wrap:pretty}
.tnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;margin:48px 0 0}
.tn b{display:block;font:700 36px/40px var(--serif);color:#F1EFE8;letter-spacing:-.01em;white-space:nowrap}
.tn b small{font:500 14px/20px var(--sans);color:#FF5A5A;margin-left:8px;letter-spacing:.04em}
.tn p{margin:8px 0 0;font:400 14px/24px var(--sans);color:#9A9CA3}
.rulersec{padding:64px 0 16px}
.ntheme{flex:none;margin-left:auto;align-self:center;padding:6px 12px;border:1px solid var(--line);border-radius:9999px;background:transparent;color:var(--ink-2);font:500 12px/16px var(--sans);letter-spacing:.04em;cursor:pointer;white-space:nowrap;transition:color .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease)}
.ntheme:hover{color:var(--ink);border-color:var(--ink-2)}
.ntheme:active{transform:scale(.98)}
@media (max-width:1100px){.h3t{font-size:96px}}
@media (max-width:480px){.h3{min-height:max(calc(100dvh - 60px),560px)}}
@media (max-width:700px){.h3t{font-size:60px}.h3s{font:500 20px/28px var(--serif)}.h3in{padding-top:32px;padding-bottom:208px}.h3a{margin-top:32px}.h3cap{left:16px;right:16px;bottom:12px;text-align:left;max-width:none}.tagl{font-size:36px;line-height:1.3}.tagrest>p{font-size:16px;line-height:28px}.tagrest{margin-top:32px}.tnums{grid-template-columns:minmax(0,1fr);gap:24px;margin-top:32px}.tn b{font-size:30px;line-height:36px}.rulersec{padding-top:48px}}
/* 竖屏：换竖幅图，火箭在右下，字在左边的夜空里 */
@media (max-aspect-ratio:4/5){.h3img img{object-position:74% 100%;transform-origin:74% 90%}.h3p{max-width:60%}.h3cap{left:16px;right:auto;bottom:12px;text-align:left;max-width:min(48%,320px)}}

/* ---------- 图 */
.dwg{display:block;width:100%;height:auto}
.dwg text{font:400 13px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
.dwg .tb{font-weight:700}
.dwg .tm{fill:var(--muted);font-size:12px}
.dwg .ts{fill:var(--ink-2);font-size:12px}
.dwg .tsm{font-size:11px}
.dwg .o{fill:none;stroke:var(--ink);stroke-width:1.4}
.dwg .o2{fill:none;stroke:var(--ink);stroke-width:.8}
.dwg .ln{fill:none;stroke:var(--line);stroke-width:1}
.dwg .ln2{fill:none;stroke:var(--line-2);stroke-width:1}
.dwg .a{stroke:var(--accent)}
.dwg .af{fill:var(--accent);stroke:none}
.dwg .fi{fill:var(--ink);stroke:none}
.dwg .fm{fill:var(--muted);stroke:none}
.dwg .fs{fill:var(--surface);stroke:none}
.dwg .fw{fill:var(--wash);stroke:none}
.dwg .d{stroke-dasharray:4 4}
.dwg .rec{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.dwg .day{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.dwg .pt{fill:var(--bg);stroke:var(--accent);stroke-width:2}
.dwg .pt2{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.dwg .glyph{fill:var(--ink-2);stroke:none}

/* ---------- 卷首 */
.hero{padding:clamp(28px,5vw,64px) 0 26px}
.strip{display:flex;flex-wrap:wrap;border:1px solid var(--ink);font-size:13px;line-height:1.3;width:max-content;max-width:100%;background:var(--surface)}
.strip span{padding:6px 12px;border-right:1px solid var(--ink)}
.strip span:last-child{border-right:0}
.strip b{font-weight:500;color:var(--muted);margin-right:.6em}
.hero h1{font-size:clamp(44px,8.6vw,118px);line-height:1.04;margin:clamp(22px,4vw,44px) 0 0;letter-spacing:.01em}
.hero .sub{font:700 clamp(18px,2.4vw,29px)/1.45 var(--serif);margin:12px 0 0;color:var(--ink-2);letter-spacing:.05em;max-width:34em}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(22px,4vw,56px);margin-top:clamp(20px,3vw,34px);align-items:start}
.thesis{font:700 clamp(17px,1.65vw,21px)/1.85 var(--serif);margin:0;letter-spacing:.02em}
.thesis em{font-style:normal;color:var(--accent-ink)}
.steps{list-style:none;margin:0;padding:0;counter-reset:st;border-top:1px solid var(--line)}
.steps li{counter-increment:st;display:grid;grid-template-columns:2.2em 1fr;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.7;color:var(--ink-2)}
.steps li::before{content:counter(st,cjk-ideographic);font:900 17px/1.5 var(--serif);color:var(--accent-ink)}
.week{display:flex;flex-wrap:wrap;gap:8px 18px;margin:18px 0 0;padding:10px 0 0;border-top:1px solid var(--line);font-size:13px;line-height:1.6;color:var(--muted)}
.week b{color:var(--ink);font-weight:500}
.week i{font-style:normal;color:var(--accent-ink)}

/* 对数速度尺 */
.rulerfig{margin:clamp(26px,4vw,46px) 0 0}
.ruler-wrap{overflow-x:auto;scrollbar-width:thin;border:1px solid var(--ink);background:var(--surface)}
.ruler-wrap svg{display:block;min-width:1100px;width:100%;height:auto}
.ruler .tick{cursor:pointer}
.ruler .tick text{font-size:12px}
.ruler .tick circle{fill:var(--bg);stroke:var(--ink);stroke-width:1.6;transition:r .15s}
.ruler .tick:hover circle,.ruler .tick.on circle{fill:var(--accent);stroke:var(--accent)}
.ruler .tick.on text{fill:var(--accent-ink);font-weight:700}
.ruler .dec{stroke:var(--ink);stroke-width:1}
.ruler .dec2{stroke:var(--line);stroke-width:.7}
.rcard{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:baseline;border:1px solid var(--ink);border-top:0;padding:14px 18px;background:var(--surface);min-height:92px}
.rcard .v{font:900 clamp(26px,3.2vw,40px)/1.1 var(--serif);color:var(--accent-ink);white-space:nowrap}
.rcard .v small{font:500 13px/1 var(--sans);color:var(--muted);margin-left:.4em;letter-spacing:.06em}
.rcard .t{font:700 17px/1.4 var(--serif)}
.rcard p{grid-column:1/-1;margin:4px 0 0;font-size:14px;line-height:1.75;color:var(--ink-2)}
.rcard .cmp{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-top:6px}
.rcard .cmp b{color:var(--ink);font-weight:500}
.rulerfig figcaption,.fig figcaption{font-size:13px;line-height:1.7;color:var(--muted);margin-top:10px;max-width:60em}

/* ---------- 章节导航 */
.cnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.cnav .row{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:1240px;margin:0 auto;padding:0 calc(var(--gut) - 12px);position:relative}
.cnav .row::-webkit-scrollbar{display:none}
.cnav a{flex:none;padding:13px 12px 12px;font-size:13.5px;line-height:1.5;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent}
.cnav a small{font-size:11px;margin-right:.45em;color:var(--accent-ink);font-family:var(--serif);font-weight:900}
.cnav a.on{color:var(--ink);border-bottom-color:var(--accent)}
.cnav .prog{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--accent);opacity:.45}

/* ---------- 章 */
.chap{padding:clamp(48px,7vw,96px) 0 clamp(20px,3vw,40px)}
.chead{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:16px;margin-bottom:clamp(22px,3.4vw,40px)}
.cno{font:900 clamp(30px,4vw,48px)/1 var(--serif);color:var(--accent-ink);align-self:end;white-space:nowrap;letter-spacing:0;font-variant-numeric:tabular-nums}
.cno small{display:block;font:500 11px/1 var(--sans);letter-spacing:.14em;color:var(--muted);margin-top:8px}
.cno sup{font-size:.55em;vertical-align:.5em}
.chead h2{font-size:clamp(28px,4.4vw,54px);line-height:1.15}
.chead .lede{grid-column:1/-1;margin:10px 0 0;max-width:46em;color:var(--ink-2)}
.sub-h{font:900 clamp(20px,2.3vw,27px)/1.3 var(--serif);margin:clamp(36px,5vw,60px) 0 10px;letter-spacing:.03em}
.sub-p{max-width:46em;color:var(--ink-2)}

/* ---------- 第一章 这一周 */
.now-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(18px,3vw,40px);align-items:start}
.nowcard{border:1px solid var(--ink);background:var(--surface)}
.nowcard .hd{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--line)}
.nowcard .hd b{font:900 20px/1.3 var(--serif)}
.nowcard .hd span{font-size:12.5px;color:var(--muted)}
.nowcard .bd{padding:14px 16px 16px}
.nowcard .bd p{font-size:14.5px;line-height:1.8;color:var(--ink-2)}
.claims{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.claims li{display:grid;grid-template-columns:7.5em 1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;line-height:1.6}
.claims li b{font-weight:500;color:var(--muted)}
.dispute{margin:12px 0 0;padding:10px 12px;border-left:3px solid var(--accent);font-size:13.5px;line-height:1.75;color:var(--ink-2);background:var(--wash)}
.dispute b{color:var(--accent-ink);font-weight:500;margin-right:.4em}
.side{display:grid;gap:14px}
.side .nowcard .hd b{font-size:17px}
.side .claims li{grid-template-columns:6.5em 1fr}
.anniv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:12px 16px;font-size:14px;line-height:1.7}
.anniv .y{font:900 20px/1.3 var(--serif);color:var(--accent-ink)}
.anniv p{margin:0;color:var(--ink-2)}

/* ---------- 第二章 五条赛道 */
.mxd{border:1px solid var(--ink);border-top:0;background:var(--surface);display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.75fr);min-height:200px}
.mxd .txt{padding:18px 20px 20px}
.mxd .kicker{font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.mxd h3{font-size:clamp(20px,2.4vw,28px);line-height:1.3;margin:4px 0 8px}
.mxd .big{font:900 clamp(30px,3.6vw,46px)/1.1 var(--serif);color:var(--accent-ink);margin:0 0 4px}
.mxd .big small{font:500 13px/1 var(--sans);color:var(--muted);margin-left:.4em;letter-spacing:.06em}
.mxd .spd{font-size:13.5px;color:var(--ink-2);margin:0 0 10px}
.mxd dl{display:grid;grid-template-columns:5em 1fr;gap:4px 12px;margin:10px 0 0;font-size:14px;line-height:1.7}
.mxd dt{color:var(--muted);font-size:12.5px;padding-top:2px}
.mxd dd{margin:0;color:var(--ink-2)}
.mxd .ph{position:relative;border-left:1px solid var(--line);background:var(--surface-2);min-height:200px}
.mxd .ph img{display:block;width:100%;height:100%;object-fit:cover;transition:filter .3s}
.mxd .ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;font-size:11.5px;line-height:1.5;color:#fff;background:linear-gradient(transparent,rgba(10,10,12,.85))}
.mxd .ph.none{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;padding:20px;text-align:center}

/* ---------- 第三章 两条总线 */
.lines-fig{border:1px solid var(--ink);background:var(--surface);padding:10px 10px 4px;overflow-x:auto;scrollbar-width:thin}
.lines-fig svg{min-width:760px}
.lkey{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:var(--ink-2);margin:10px 0 0}
.lkey i{display:inline-block;width:26px;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:8px}
.lkey i.k2{border-top-color:var(--ink)}
.lkey i.k3{border-top:2px dashed var(--muted)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(18px,3vw,40px);align-items:start}
.pts{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.pts li{display:grid;grid-template-columns:4.2em 1fr auto;gap:6px 12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.65;align-items:baseline}
.pts .y{font:900 15px/1.4 var(--serif)}
.pts .v{font:700 14px/1.4 var(--serif);white-space:nowrap;color:var(--accent-ink)}
.pts.day .v{color:var(--ink)}
.pts p{grid-column:2/-1;margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
.counter{border:1px solid var(--ink);padding:16px 18px;background:var(--wash);margin-top:22px}
.counter h3{font-size:18px;margin:0 0 8px}
.counter ul{margin:0;padding-left:1.2em;font-size:14px;line-height:1.8;color:var(--ink-2)}

/* ---------- 第四章 物理墙 */
.walls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.wall{border:1px solid var(--ink);background:var(--surface);display:flex;flex-direction:column}
.wall .hd{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.wall .hd b{font:900 21px/1.3 var(--serif)}
.wall .f{font:700 14px/1.5 var(--serif);color:var(--accent-ink);overflow-wrap:anywhere}
.wall .bd{padding:14px 18px 18px}
.wall details.fold{margin:0;border:0;border-top:1px solid var(--line)}
.wall details.fold p,.wall details.fold ul{font-size:13.5px;line-height:1.75;color:var(--ink-2)}
.wall details.fold h4{margin:10px 0 4px}
.wall .bd p{font-size:14.5px;line-height:1.8;color:var(--ink-2)}
.wall ul{margin:8px 0 0;padding-left:1.1em;font-size:13.5px;line-height:1.75;color:var(--ink-2)}
.wall .ex{margin:12px 0 0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--wash);font-size:13.5px;line-height:1.7}
.wall .ex b{color:var(--accent-ink);font-weight:500;margin-right:.4em}
.wall .ph{margin:0;border-top:1px solid var(--line)}
.wall .ph img{display:block;width:100%;height:auto;max-height:260px;object-fit:cover}
.wall .ph figcaption{font-size:11.5px;line-height:1.5;color:var(--muted);padding:6px 12px}

/* ---------- 第五章 卡片 */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.chips button{font:500 12.5px/1 var(--sans);padding:8px 11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chips .cnt{align-self:center;font-size:12.5px;color:var(--muted);margin-left:6px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{border:1px solid var(--ink);background:var(--surface);padding:14px 16px 16px;position:relative;display:flex;flex-direction:column}
.card.hide{display:none}
.card .y{font:900 26px/1 var(--serif);color:var(--accent-ink)}
.card .tag{position:absolute;right:10px;top:10px}
.card h3{font-size:17px;line-height:1.45;margin:8px 0 6px;padding-right:3em}
.card p{font-size:13.5px;line-height:1.8;color:var(--ink-2);margin:0}
.card .n{margin:10px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .n b{font-weight:700}
.card details{margin-top:6px}
.card summary{font-size:12px;color:var(--muted);cursor:pointer}
.card figure{margin:10px -16px -16px;border-top:1px solid var(--line)}
.card figure img{display:block;width:100%;height:150px;object-fit:cover}
.card figure figcaption{font-size:11px;color:var(--muted);padding:4px 16px 8px;line-height:1.5}

/* ---------- 第六章 小工具 */
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.tool{border:1px solid var(--ink);background:var(--surface)}
.tool .hd{padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.tool .hd b{font:900 20px/1.3 var(--serif)}
.tool .hd p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.tool .bd{padding:14px 18px 18px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frow input,.frow select{font:500 16px/1.2 var(--sans);padding:9px 10px;border:1px solid var(--ink);background:var(--bg);color:var(--ink);min-width:0}
.frow input[type=number]{width:9em}
.frow label{font-size:13px;color:var(--muted)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.presets button{font:500 12px/1 var(--sans);padding:7px 9px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer}
.presets button:hover{border-color:var(--accent);color:var(--accent-ink)}
.out{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.out li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:14px;line-height:1.6;align-items:baseline}
.out li b{font:700 16px/1.3 var(--serif);color:var(--accent-ink);white-space:nowrap}
.out li span{color:var(--ink-2)}
.out li small{display:block;font-size:11.5px;color:var(--muted)}
.gauge{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--ink);margin-top:14px}
.gauge div{background:var(--surface);padding:12px 12px 10px}
.gauge b{display:block;font:900 clamp(22px,2.6vw,32px)/1.1 var(--serif);color:var(--accent-ink)}
.gauge span{font-size:12px;color:var(--muted);line-height:1.5;display:block;margin-top:4px}
.verdict{margin:12px 0 0;font-size:13.5px;line-height:1.75;color:var(--ink-2);padding:10px 12px;border-left:3px solid var(--accent);background:var(--wash)}

/* ---------- 深色「发布会」带：卷首与序章把令牌整体换成沥青黑底，章节正文仍随深浅色切换 */
.band{--bg:var(--band-bg);--surface:var(--band-surface);--surface-2:#2A2A2F;--ink:var(--band-ink);--ink-2:var(--band-ink-2);--muted:var(--band-muted);--line:var(--band-line);--line-2:#2C2D33;--accent:var(--band-accent);--accent-ink:var(--band-accent);--wash:rgba(255,90,90,.14);--wash-2:rgba(255,90,90,.24);--grid:rgba(241,239,232,.05);background:var(--bg);color:var(--ink)}
.band .dwg text{stroke:var(--bg)}
.band .conf{border-color:var(--line);color:var(--muted)}
.band .conf.h{border-color:var(--ink);color:var(--ink)}

/* 卷首指标带（学性能页：大数字 + 小单位 + 口径行） */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:clamp(20px,3vw,34px) 0 0}
.stat{background:var(--bg);padding:16px 18px 14px}
.stat .k{font:700 11px/1 var(--sans);letter-spacing:.18em;color:var(--accent)}
.stat .v{margin:10px 0 4px;font:900 clamp(34px,4.2vw,60px)/1 var(--serif);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{font:500 13px/1 var(--sans);color:var(--muted);margin-left:.4em;letter-spacing:.08em}
.stat .d{font-size:13px;line-height:1.6;color:var(--ink-2)}
.stat .n{font-size:11.5px;line-height:1.5;color:var(--muted);margin-top:4px}

/* ---------- 序章 · 速度之旅：左侧固定舞台（剪影 + 对数仪表 + 读数），右侧十九级卡片滚过 */
.journey{padding-bottom:0}
.jwrap{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);align-items:start;border-top:1px solid var(--line)}
.jstage{position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));min-height:520px;display:grid;grid-template-rows:minmax(0,1fr) auto;border-right:1px solid var(--line);background:var(--bg);overflow:hidden}
.jscene{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.jveh-wrap{position:absolute;inset:0 0 76px 0}
.spdlines{position:absolute;inset:0;width:100%;height:100%;z-index:2;mix-blend-mode:screen}
.spd{stroke:var(--accent);stroke-width:2;opacity:0;stroke-dasharray:70 50;stroke-linecap:round}
.jscene.moving .spd{animation:spdrun .55s linear infinite;opacity:var(--op,.45);animation-delay:calc(var(--i) * -.09s)}
@keyframes spdrun{from{stroke-dashoffset:0}to{stroke-dashoffset:-120}}
.veh{position:absolute;inset:0;overflow:hidden;opacity:0;transform:translateX(46%);transition:transform .95s cubic-bezier(.16,1,.3,1),opacity .45s;pointer-events:none;will-change:transform}
.veh.on{opacity:1;transform:none}
.veh.out{opacity:0;transform:translateX(-55%);transition:transform .5s cubic-bezier(.7,0,.84,0),opacity .35s}
.jhud{z-index:3;position:absolute;left:clamp(16px,3vw,40px);right:16px;bottom:14px;display:flex;align-items:baseline;gap:6px 18px;flex-wrap:wrap}
.jk{font:700 11.5px/1 var(--sans);letter-spacing:.2em;color:var(--accent);width:100%}
.jt{font:900 clamp(22px,2.6vw,36px)/1.1 var(--serif);color:var(--ink)}
.jc{margin-left:auto;font:500 13px var(--sans);color:var(--muted);letter-spacing:.12em;font-variant-numeric:tabular-nums}
.jladder{position:absolute;left:0;right:0;top:0;display:flex;gap:2px;height:6px;z-index:2}
.lad{flex:1;border:0;padding:0;margin:0;height:6px;background:var(--line);cursor:pointer;appearance:none;transition:background .3s}
.lad i{display:none}
.lad.done{background:var(--ink-2)}
.lad.on{background:var(--accent)}
.lad:hover{background:var(--ink)}
.jdial{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:6px 22px;padding:10px clamp(16px,3vw,40px) 12px}
.gdial{width:clamp(150px,24vh,240px);height:auto;display:block}
.g-track{fill:none;stroke:var(--line);stroke-width:10}
.g-red{fill:none;stroke:var(--accent);stroke-width:10;opacity:.3}
.g-fill{fill:none;stroke:var(--ink);stroke-width:10;stroke-dasharray:0 1;transition:stroke-dasharray .9s cubic-bezier(.16,1,.3,1)}
.g-tick{stroke:var(--ink);stroke-width:2}
.g-tick2{stroke:var(--muted);stroke-width:1;opacity:.6}
.g-lab{font:500 15px var(--sans);fill:var(--ink-2)}
.g-mark{stroke:var(--accent);stroke-width:2.5}
.g-mk{font:500 13px var(--sans);fill:var(--muted)}
.g-unit{font:500 12px var(--sans);fill:var(--muted);letter-spacing:.12em}
.g-redlab{font:500 12px var(--sans);fill:var(--accent)}
.g-needle{transition:transform .9s cubic-bezier(.16,1,.3,1)}
.g-needle path{fill:var(--accent)}
.g-needle circle{fill:var(--bg);stroke:var(--ink);stroke-width:3}
.jread{text-align:left;min-width:0}
.jnum b{font:900 clamp(40px,5.2vw,76px)/1 var(--serif);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.jnum span{font:500 13px var(--sans);color:var(--muted);margin-left:.45em;letter-spacing:.14em}
.jalt{font-size:13px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums;line-height:1.6}
.jsteps{min-width:0;padding:0 var(--gut) 0 clamp(20px,3vw,44px)}
.jstep{min-height:calc(100vh - var(--nav-h));display:grid;grid-template-columns:1fr;align-content:center;gap:18px;padding:40px 0;border-top:1px solid var(--line);opacity:.28;transition:opacity .45s}
.jstep:first-child{border-top:0}
.jstep.on{opacity:1}
.jcard-hd{display:flex;gap:16px;font:500 12px/1 var(--sans);letter-spacing:.16em;color:var(--muted)}
.jno{color:var(--accent);font-weight:700}
.jcard h3{font-size:clamp(24px,2.6vw,36px);line-height:1.15;margin:12px 0 2px;color:var(--ink)}
.jbig{margin:0 0 6px}
.jbig b{font:900 clamp(40px,4.6vw,66px)/1 var(--serif);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.jbig small{font:500 13px var(--sans);color:var(--muted);margin-left:.45em;letter-spacing:.12em}
.jtag{font:400 15.5px/1.85 var(--sans);color:var(--ink-2);max-width:34em;margin:0 0 4px}
.jspecs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:12px 0 10px}
.jspecs div{background:var(--bg);padding:9px 11px 10px;min-width:0}
.jspecs span{display:block;font:500 10.5px/1.3 var(--sans);letter-spacing:.12em;color:var(--muted)}
.jspecs b{display:block;font:700 13.5px/1.45 var(--serif);color:var(--ink);margin-top:5px;overflow-wrap:anywhere}
.jwho{font-size:13px;color:var(--muted);margin:0 0 4px}
.jstep .src{margin-top:2px;font-size:12px}
.jph{margin:0;position:relative;aspect-ratio:16/9;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.jph img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.03);transition:transform 7s linear}
.jstep.on .jph img{transform:scale(1.12)}
.jph figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 9px;font-size:11.5px;line-height:1.5;color:#fff;background:linear-gradient(transparent,rgba(5,5,8,.88))}
.jnote{color:var(--muted);font-size:13px;line-height:1.7;padding:24px var(--gut) 40px;margin:0 auto;max-width:1240px;border-top:1px solid var(--line)}
@media (max-width:980px){
  .stats{grid-template-columns:1fr}
  .jwrap{grid-template-columns:1fr}
  .jstage{height:clamp(380px,58vh,540px);min-height:0;border-right:0;border-bottom:1px solid var(--ink);z-index:5}
  .jveh-wrap{inset:0 0 64px 0}
  .jdial{grid-template-columns:auto minmax(0,1fr);padding:8px 16px 10px;gap:4px 14px}
  .gdial{width:clamp(96px,18vh,150px)}
  .jnum b{font-size:clamp(30px,8vw,44px)}
  .jalt{font-size:11.5px;margin-top:4px}
  .jt{font-size:20px}
  .jsteps{padding:0 var(--gut)}
  .jstep{min-height:0;padding:28px 0}
}
@media (max-width:600px){
  .jspecs{grid-template-columns:1fr 1fr}
  .jhud{gap:4px 10px}
  .jc{width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  .g-needle,.g-fill,.veh,.jph img{transition:none}
  .jscene.moving .spd{animation:none;opacity:.3}
  .jstep.on .jph img{transform:none}
}
/* ---------- 折叠（附录、资料索引） */
details.fold{border:1px solid var(--line);background:var(--surface);margin:10px 0 0}
details.fold>summary{cursor:pointer;list-style:none;padding:10px 14px;font:500 13px/1.5 var(--sans);color:var(--ink-2);display:flex;align-items:center;gap:10px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"+";font:700 15px/1 var(--sans);color:var(--accent);width:14px;flex:none}
details.fold[open]>summary::before{content:"−"}
details.fold>summary h3{margin:0;font-size:17px;display:inline}
details.fold.big>summary{padding:14px 18px}
details.fold.big>summary h3{font-size:20px}
details.fold>:not(summary){padding:0 14px 14px}
details.fold.big>:not(summary){padding:0 18px 18px}
details.fold .refs{columns:2;column-gap:40px}
details.fold .pts{margin-top:6px}
.card details summary{list-style:none}

/* ---------- 第五章 · 驾驭 */
.facts{list-style:none;margin:0 0 22px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.facts li{background:var(--surface);border:1px solid var(--line);padding:14px 16px 12px}
.facts p{font:400 14px/1.75 var(--sans);color:var(--ink-2);margin:0}
.facts .src{font-size:11.5px;margin-top:6px}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.hcard{border:1px solid var(--ink);background:var(--surface);display:flex;flex-direction:column}
.hcard:first-child{grid-column:1/-1;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.hph{margin:0;position:relative;aspect-ratio:21/9;overflow:hidden;border-bottom:1px solid var(--line);background:var(--surface-2)}
.hph img{display:block;width:100%;height:100%;object-fit:cover;}
.hph figcaption{position:absolute;left:0;right:0;bottom:0;padding:20px 12px 8px;font-size:11.5px;line-height:1.5;color:#fff;background:linear-gradient(transparent,rgba(5,5,8,.86))}
.hbd{padding:14px 18px 18px;display:flex;flex-direction:column;gap:8px}
.hhd{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted)}
.hcard h3{font-size:clamp(18px,2vw,23px);line-height:1.35;margin:0}
.hprob,.hsol,.hcost{margin:0;font-size:14px;line-height:1.8;color:var(--ink-2)}
.hprob b,.hsol b,.hcost b{display:block;font:700 11px/1.4 var(--sans);letter-spacing:.14em;color:var(--muted);margin-bottom:2px}
.hprob b{color:var(--accent-ink)}
.hprob{padding-left:12px;border-left:3px solid var(--accent)}
.hnums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.hnums div{background:var(--bg);padding:8px 10px 9px;min-width:0;position:relative;padding-right:52px}
.hnums span{display:block;font:500 10.5px/1.3 var(--sans);letter-spacing:.1em;color:var(--muted)}
.hnums b{display:block;font:700 13.5px/1.45 var(--serif);color:var(--ink);margin-top:3px;overflow-wrap:anywhere}
.hnums i.kind{position:absolute;right:6px;top:6px;font-style:normal;font-size:10px;padding:3px 5px}
.tag.kind.claim{background:transparent;color:var(--accent-ink);border:1px solid var(--accent)}
.tag.kind.meas,.tag.kind.off{background:var(--ink);color:var(--bg)}
.tag.kind.des{background:transparent;color:var(--muted);border:1px solid var(--line)}
.hlink{margin:0;font-size:13px;line-height:1.7;color:var(--ink);padding:8px 10px;background:var(--wash)}
.hcard .src{font-size:12px}
/* 序章舞台改用照片 */
.veh img{display:block;width:100%;height:100%;object-fit:cover}
.veh.on img{animation:kb 9s linear forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.veh::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 60%,rgba(23,24,28,.8))}
.veh-c{background:radial-gradient(ellipse at 60% 50%,rgba(255,90,90,.25),transparent 60%)}
.cglyph{text-align:center}
.cglyph b{display:block;font:900 clamp(120px,22vw,260px)/1 var(--serif);color:var(--ink);letter-spacing:-.04em}
.cglyph span{font:500 14px var(--sans);color:var(--muted);letter-spacing:.2em}
.jcap{font-size:11.5px;line-height:1.5;color:var(--muted);margin:6px 0 0}
@media (max-width:980px){.hgrid{grid-template-columns:1fr}.hcard:first-child{grid-column:auto}details.fold .refs{columns:1}}
@media (max-width:600px){.hnums{grid-template-columns:1fr}}

/* ---------- 五条赛道（小图） */
.tracks{border:1px solid var(--ink);background:var(--surface)}
.trk{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line)}
.trk:last-child{border-bottom:0}
.trk.body{background:var(--surface-2)}
.trk .th{padding:12px 12px;border-right:1px solid var(--line)}
.trk .th b{display:flex;align-items:center;gap:8px;font:700 13.5px/1.3 var(--sans)}
.trk .th svg{width:22px;height:22px;flex:none}
.trk .th span{display:block;font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
.tbars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1px;height:118px;padding:8px 8px 0}
.tb{appearance:none;border:0;background:transparent;position:relative;padding:0;cursor:pointer;display:block;height:100%;font:inherit;color:inherit}
.tb i{position:absolute;left:30%;right:30%;bottom:22px;height:var(--h,10%);background:var(--ink-2);transform-origin:bottom;transform:scaleY(0);transition:transform .8s cubic-bezier(.16,1,.3,1),background .2s}
.fade.in .tb i{transform:none}
.tb b{position:absolute;left:0;right:0;bottom:calc(var(--h,10%) + 24px);font:700 10.5px/1 var(--serif);color:var(--muted);text-align:center;opacity:.85;transition:opacity .2s;white-space:nowrap}
.tb span{position:absolute;left:0;right:0;bottom:4px;font:500 10px/1.2 var(--sans);color:var(--muted);text-align:center}
.tb:hover i,.tb.on i{background:var(--accent)}
.tb:hover b,.tb.on b{opacity:1;color:var(--accent-ink)}
.tb.none{cursor:default}
.tb.none i{height:4px;background:var(--line);transform:none}
.trk .tbars .tb:nth-child(n){--d:0}
/* ---------- 第三章 播放 */
.lctl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 6px 4px;position:relative}
.lctl input[type=range]{width:100%}
.lyr{display:flex;gap:14px;align-items:baseline;font-size:13px;color:var(--muted);white-space:nowrap}
.lyr b{font:900 22px/1 var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.lyr i{font-style:normal;font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums}
#ln-day i{color:var(--ink)}
