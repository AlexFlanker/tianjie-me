<div class="wrap">

  <nav class="timeline" aria-label="时期">
    <div class="tl-scroll"><div class="tl" id="tl"><div class="tl-fill" id="tlfill"></div></div></div>
  </nav>

  <section class="atlas">
    <div class="map-col">
      <div class="toolbar">
        <div class="seg" role="group" aria-label="地图着色方式" id="modes">
          <button data-mode="fam" aria-pressed="true">风味分区</button>
          <button data-mode="taste" aria-pressed="false">口味主调</button>
          <button data-mode="staple" aria-pressed="false">主食</button>
        </div>
        <button class="play" id="play" aria-pressed="false"><span class="dot"></span><span id="playtxt">播放演化</span></button>
      </div>
      <div class="map-wrap" id="mapwrap"></div>
      <div class="infobar" id="infobar">
        <div class="sw" id="ib-sw"></div>
        <div class="t"><b id="ib-name">把鼠标移到省份上</b><span class="r" id="ib-region"></span><p id="ib-note">或在手机上点按省份，查看它在当前时期所属的风味分区。</p></div>
        <button class="go" id="ib-go" hidden>查看沿革 →</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="legend-note" id="legendnote"></div>
    </div>
    <aside class="panel" id="panel"></aside>
  </section>

  <section class="section" id="scroll">
    <div class="section-head"><h2>四维长卷</h2><p>四条线索在十个时期里的关键节点——点任一格切换时期，右栏（手机上为地图下方）会展开详情与出处。</p></div>
    <div class="matrix-wrap"><table class="matrix" id="matrix"></table></div>
  </section>

  <section class="section" id="regions">
    <div class="section-head"><h2>各地菜系沿革</h2><p>34 个省级行政区。每张卡片的色带是它在十个时期中所属的风味分区（同色 = 同一菜系家族），点卡片读完整沿革。</p></div>
    <div class="cards" id="cards"></div>
  </section>

  <section class="section refs" id="refs">
    <div class="section-head"><h2>主要参考</h2></div>
    <ol id="refs-list"></ol>
    <p class="note" id="mapnote"></p>
  </section>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="bd" id="drawer-bd"></div>
  <div class="pn" id="drawer-pn" role="dialog" aria-modal="true" aria-labelledby="dr-title"></div>
</div>
