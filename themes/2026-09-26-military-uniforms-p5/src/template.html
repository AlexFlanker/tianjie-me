<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}｜一周一题</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="article">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 皮肤「橄榄与猩红」v2（2026-11-10，按第 5、8 题的版面系统重排）：
   默认是深橄榄黑 #12140E 为底、米白字，红衣的猩红是唯一强调色；卷首、论点、序章是不随主题切换的「夜色带」。浅色模式是「白天读」：卡其纸的米黄底、墨绿黑字、暗猩红。
   字号只取 12/14/16/18/20/24/30/36/48/60/96；间距只取 4/8/12/16/24/32/40/48/64/80/96；圆角 4/6/8/12/16/全圆。
   缓动统一 cubic-bezier(.22,1,.36,1)；拖动与弹簧由 app.js 驱动。图表里的界面色都走下面的 token，数据色（各国军服的颜色）来自底稿。 */
:root{
  --bg:#12140E;--surface:#1A1D14;--surface-2:#252A1C;
  --ink:#EFEBDD;--ink-2:#C8C4B2;--muted:#8F9080;
  --line:rgba(239,235,221,.16);--line-2:rgba(239,235,221,.08);--grid:rgba(239,235,221,.06);
  --accent:#E5484D;--accent-2:#C8102E;--accent-ink:#FF6F66;--wash:rgba(229,72,77,.10);--wash-2:rgba(229,72,77,.2);--fill:#C8102E;--on-fill:#FFFFFF;
  --glass:rgba(14,16,10,.66);--glass-line:rgba(239,235,221,.14);--nav-glass:rgba(18,20,14,.78);
  --nav-h:48px;--gut:clamp(16px,3.2vw,40px);--ruler-h:80px;--r:16px;
  --ease:cubic-bezier(.22,1,.36,1);
  --serif:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC",serif;
  --sans:"Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F2EEE0;--surface:#E9E4D2;--surface-2:#DFD9C4;
  --ink:#1D2016;--ink-2:#444837;--muted:#6E705E;
  --line:rgba(29,32,22,.2);--line-2:rgba(29,32,22,.1);--grid:rgba(29,32,22,.06);
  --accent:#B3261E;--accent-2:#9B1C16;--accent-ink:#A3211A;--wash:rgba(179,38,30,.08);--wash-2:rgba(179,38,30,.16);--fill:#A3211A;--on-fill:#FFFFFF;
  --nav-glass:rgba(242,238,224,.82);--glass-line:rgba(29,32,22,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--nav-h) + 16px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/28px var(--sans);font-variant-numeric:tabular-nums;overflow-x:hidden;transition:background-color .3s var(--ease),color .3s var(--ease)}
a{color:var(--accent-ink);text-underline-offset:4px;transition:color .3s var(--ease)}
a:focus-visible,button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0 0 16px;text-wrap:pretty}
button{font-family:var(--sans)}
img{max-width:100%}
.wide{max-width:1240px;margin:0 auto;padding:0 var(--gut)}
.small{font-size:14px;line-height:24px;color:var(--muted)}
.fade{opacity:0;transform:translateY(32px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.fade.in{opacity:1;transform:none}
.conf{display:inline-block;font:500 12px/16px var(--sans);letter-spacing:.04em;padding:2px 8px;border:1px solid var(--line);border-radius:4px;color:var(--muted);vertical-align:1px}
.conf.h{border-color:var(--ink-2);color:var(--ink)}
.conf.l{border-style:dashed}
.rf{font-size:12px;color:var(--muted);text-decoration:none;white-space:nowrap}
.rf:hover{color:var(--accent-ink)}
.rfs{font-size:12px;line-height:20px;color:var(--muted)}
.dispute{margin:16px 0 0;padding:12px 16px;border-radius:8px;font-size:14px;line-height:24px;color:var(--ink-2);background:var(--wash)}
.dispute b{color:var(--accent-ink);font-weight:600;margin-right:8px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 24px 48px -24px rgba(0,0,0,.6)}
.fnote{margin:16px 0 0;max-width:60em;font-size:12px;line-height:20px;color:var(--muted)}
.zoom{appearance:none;display:block;width:100%;padding:0;margin:0;border:0;background:none;cursor:zoom-in;border-radius:8px;overflow:hidden}

/* ---------- 夜色带（卷首、论点、序章）：不随深浅色切换 */
.band{--bg:#0B0C08;--surface:#14160F;--surface-2:#20241A;--ink:#EFEBDD;--ink-2:#C8C4B2;--muted:#8F9080;--line:rgba(239,235,221,.16);--line-2:rgba(239,235,221,.08);--accent:#E5484D;--accent-2:#C8102E;--accent-ink:#FF6F66;--wash:rgba(229,72,77,.10);--wash-2:rgba(229,72,77,.2);--fill:#C8102E;--on-fill:#fff;--glass:rgba(14,16,10,.66);--glass-line:rgba(239,235,221,.14);background:var(--bg);color:var(--ink);color-scheme:dark}

/* ---------- 卷首：一张横幅油画铺满，字压在左下的暗部 */
.h3{position:relative;min-height:max(calc(100dvh - 36px),600px);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;color:#fff;isolation:isolate}
.h3img{position:absolute;inset:0;margin:0;z-index:-2;background:#0B0C08}
.h3img img{display:block;width:100%;height:100%;object-fit:cover;object-position:42% 40%;transform:scale(1.05);animation:h3zoom 2.4s var(--ease) .1s forwards}
@keyframes h3zoom{to{transform:scale(1)}}
.h3scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(11,12,8,.28) 0%,rgba(11,12,8,0) 30%,rgba(11,12,8,.55) 62%,rgba(11,12,8,.94) 100%)}
.h3in{width:100%;padding-top:96px;padding-bottom:80px}
.h3k{margin:0;font:500 14px/20px var(--sans);letter-spacing:.08em;color:rgba(255,255,255,.78)}
.h3t{margin:16px 0 0;font:700 96px/1.05 var(--serif);letter-spacing:-.01em;color:#fff;text-shadow:0 2px 32px rgba(0,0,0,.5)}
.h3s{margin:24px 0 0;font:500 24px/36px var(--serif);color:rgba(255,255,255,.92)}
.h3s span{display:block}
.h3a{margin:40px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 16px 12px 24px;border-radius:9999px;background:#C8102E;color:#fff;font:600 16px/24px var(--sans);text-decoration:none;transition:transform .3s var(--ease),background-color .3s var(--ease)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s var(--ease)}
.btn:hover{background:#E5484D}
.btn:hover svg{transform:translateY(2px)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:4px}
.h3p{font:400 14px/20px var(--sans);color:rgba(255,255,255,.78)}
.h3cap{position:absolute;right:24px;bottom:16px;margin:0;max-width:520px;font:400 12px/16px var(--sans);color:rgba(255,255,255,.6);text-align:right;text-wrap:balance}
.rise{opacity:0;transform:translateY(32px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rise.in{opacity:1;transform:none}
/* 论点：逐词点亮——先闪一下猩红，再定成米白，像染料褪成本色 */
.tagsec{position:relative;height:240vh}
.tagstick{position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));display:flex;align-items:center}
.tagstick>.wide{width:100%}
.tagsec.flow{height:auto}
.tagsec.flow .tagstick{position:static;height:auto;padding:96px 0}
.tagl{margin:0;font:700 60px/1.3 var(--serif);letter-spacing:-.01em}
.tagl .ln{display:block}
.tagl .w{display:inline-block;color:rgba(239,235,221,.2);transition:color .5s var(--ease)}
.tagl .w.on{color:#EFEBDD;animation:dye .9s var(--ease)}
@keyframes dye{0%{color:#E5484D;transform:translateY(8px)}45%{color:#FF8A80}100%{color:#EFEBDD;transform:none}}
.tagrest{margin:40px 0 0;opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.tagrest.on{opacity:1;transform:none}
.tagrest>p{margin:0;max-width:680px;font:400 18px/32px var(--sans);color:#C8C4B2}
.tnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;margin:48px 0 0;max-width:900px}
.tn b{display:block;font:700 48px/56px var(--serif);color:#EFEBDD}
.tn b small{font:500 14px/20px var(--sans);color:#FF6F66;margin-left:8px}
.tn p{margin:8px 0 0;font:400 14px/24px var(--sans);color:#9A9B8A}

/* ---------- 章节导航 */
.cnav{position:sticky;top:0;z-index:30;background:var(--nav-glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--glass-line)}
.cnav .row{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:1240px;margin:0 auto;padding:0 calc(var(--gut) - 12px);position:relative}
.cnav .row::-webkit-scrollbar{display:none}
.cnav a{flex:none;padding:12px;font-size:14px;line-height:22px;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;transition:color .3s var(--ease),border-color .3s var(--ease)}
.cnav a:hover{color:var(--ink)}
.cnav a small{font:700 12px/16px var(--serif);margin-right:8px;color:var(--accent-ink)}
.cnav a.on{color:var(--ink);border-bottom-color:var(--accent)}
.cnav .prog{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--accent);opacity:.5;transform-origin:0 50%;transform:scaleX(0);pointer-events:none}
.ntheme{flex:none;margin-left:auto;align-self:center;font:500 14px/20px var(--sans);color:var(--muted);background:none;border:0;padding:8px 12px;border-radius:9999px;cursor:pointer;white-space:nowrap;transition:color .3s var(--ease),background-color .3s var(--ease)}
.ntheme:hover{color:var(--ink);background:var(--wash)}

/* ---------- 章：图版开篇（左字右图） */
.chap{padding:96px 0 48px}
.chead{margin-bottom:64px}
.plate{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:end}
.ptext{padding-bottom:40px}
.cno{margin:0 0 16px;font:700 14px/20px var(--serif);letter-spacing:.12em;color:var(--accent-ink)}
.chead h2{font-size:60px;line-height:1.1}
.chead .lede{margin:24px 0 0;max-width:30em;font-size:18px;line-height:32px;color:var(--ink-2)}
.pimg{margin:0}
.pimg .zoom{border-radius:4px}
.pimg img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;background:var(--surface)}
.pimg figcaption{margin-top:12px;font-size:12px;line-height:20px;color:var(--muted)}
.sec{margin:96px 0 0}
.sech{margin:0 0 32px;max-width:680px}
.sech h3{font-size:36px;line-height:44px}
.sech p{margin:16px 0 0;font-size:16px;line-height:28px;color:var(--ink-2)}

/* ---------- 序章：八个时代（滚动与尺子是同一个量 t） */
.tl{padding:0}
.tlintro{padding-top:96px;padding-bottom:48px}
.tlintro h2{font-size:48px;line-height:56px}
.tlintro .lede{margin:24px 0 0;max-width:32em;font-size:18px;line-height:32px;color:var(--ink-2)}
.tlpin{position:relative;height:500vh}
.tlstage{position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));height:calc(100svh - var(--nav-h));min-height:560px;overflow:hidden;background:#0B0C08}
.tlbg{position:absolute;inset:-64px;overflow:hidden}
.tlbg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(56px) saturate(1.2);opacity:0;transition:opacity .9s var(--ease)}
.tlbg img.on{opacity:.4}
.tlplate{position:absolute;z-index:2;margin:0;left:calc(clamp(16px,3vw,40px) + 420px + 40px);right:clamp(16px,3vw,40px);top:clamp(16px,2.6vw,32px);bottom:calc(var(--ruler-h) + 32px);display:flex;flex-direction:column}
.tlpics{position:relative;flex:1 1 auto;min-height:0}
.tlpics img{position:absolute;left:0;right:0;bottom:0;top:auto;margin:0 auto;max-width:100%;max-height:100%;width:auto;height:auto;border-radius:8px;box-shadow:0 32px 64px -24px rgba(0,0,0,.8);opacity:0;transition:opacity .5s var(--ease),transform .5s var(--ease),filter .5s var(--ease);will-change:opacity,transform}
.tlpics img.on{opacity:1}
.tlpics img.from-r{transform:translateX(48px);filter:blur(8px)}
.tlpics img.from-l{transform:translateX(-48px);filter:blur(8px)}
.tlpics img.to-l{opacity:0;transform:translateX(-48px);filter:blur(8px)}
.tlpics img.to-r{opacity:0;transform:translateX(48px);filter:blur(8px)}
.tlcap{flex:none;margin:12px 0 0;min-height:32px;font-size:12px;line-height:16px;color:var(--muted)}
.tlcap .cs{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tlcap .cr{display:block}
.tlcard{position:absolute;z-index:4;left:clamp(16px,3vw,40px);bottom:calc(var(--ruler-h) + 32px);max-height:calc(100% - var(--ruler-h) - 96px);width:420px;padding:24px;border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.tlhint{position:absolute;z-index:3;left:clamp(16px,3vw,40px);top:clamp(16px,2.6vw,32px);margin:0;font:600 12px/16px var(--sans);letter-spacing:.12em;color:var(--muted)}
.tlcard>*{flex:none}
.tlcard .swap{transition:opacity .3s var(--ease),transform .3s var(--ease)}
.tlcard.swapping .swap{opacity:0;transform:translateY(8px)}
.tlhd{display:flex;gap:12px;flex-wrap:wrap;font:500 12px/16px var(--sans);letter-spacing:.08em;color:var(--muted)}
.tlno{color:var(--accent-ink);font-weight:700}
.tlname{margin:12px 0 0;font-size:36px;line-height:44px;color:var(--ink)}
.tltext{margin:12px 0 0;font:400 16px/28px var(--sans);color:var(--ink-2)}
.tlrows{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--line-2)}
.tlrows li{border-bottom:1px solid var(--line-2)}
.tlrows button{appearance:none;width:100%;display:grid;grid-template-columns:3.2em 56px minmax(0,1fr);gap:12px;align-items:center;padding:8px 4px;border:0;background:none;color:inherit;text-align:left;cursor:pointer;border-radius:6px;transition:background-color .3s var(--ease)}
.tlrows button:hover{background:var(--wash)}
.tlrows b{font:700 14px/20px var(--serif);color:var(--ink)}
.tlrows em{font:400 14px/20px var(--sans);font-style:normal;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{display:flex;height:16px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.sw i{flex:1 1 0;min-width:0}
/* 尺子：八个时代等距排开 */
.tlruler{position:absolute;z-index:5;left:clamp(12px,2vw,24px);right:clamp(12px,2vw,24px);bottom:16px;height:var(--ruler-h);border-radius:var(--r);touch-action:pan-y;cursor:grab;-webkit-user-select:none;user-select:none}
.tlruler.drag{cursor:grabbing}
.rin{position:absolute;left:clamp(40px,6vw,80px);right:clamp(40px,6vw,80px);top:0;bottom:0}
.rtrack{position:absolute;left:0;right:0;top:12px;bottom:0}
.rline{position:absolute;left:0;right:0;top:13px;height:2px;border-radius:1px;background:rgba(239,235,221,.18)}
.rmark{position:absolute;top:14px;transform:translate(-50%,-50%);width:28px;height:28px;padding:0;border:0;background:transparent;cursor:pointer;z-index:1;color:inherit}
.rmark i{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--accent);transition:transform .3s var(--ease)}
.rmark span{position:absolute;top:24px;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;opacity:0;transition:opacity .3s var(--ease)}
.rmark span b{display:block;font:500 12px/16px var(--sans);color:var(--ink-2);transition:color .3s var(--ease)}
.rmark span small{display:block;font:400 12px/16px var(--sans);color:var(--muted)}
.tlruler.all .rmark span,.rmark.on span,.rmark.edge span{opacity:1}
.rmark.on span b{color:var(--accent-ink);font-weight:700}
.rhead{position:absolute;left:0;top:0;height:28px;width:0;will-change:transform;pointer-events:none}
.rhead i{position:absolute;left:-10px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--accent-ink);box-shadow:0 0 0 4px rgba(229,72,77,.24),0 0 20px rgba(229,72,77,.5);transition:transform .3s var(--ease)}
.tlruler.drag .rhead i{transform:scale(1.18)}

/* ---------- 01 颜色总线 */
.tool{padding:24px;border-radius:var(--r);background:var(--surface)}
.bushd{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;margin:0 0 16px}
.busyr{min-width:0}
.busyr b{display:block;font:700 60px/1 var(--serif);color:var(--ink);letter-spacing:-.02em}
.busyr span{display:block;margin-top:8px;font-size:14px;line-height:24px;color:var(--ink-2)}
.busyr span em{font-style:normal;font-weight:600;color:var(--accent-ink);margin-right:8px}
.buschips{display:flex;flex-wrap:wrap;gap:8px}
.buschips button{font:500 14px/20px var(--sans);padding:6px 12px;border-radius:9999px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer;transition:color .3s var(--ease),background-color .3s var(--ease),border-color .3s var(--ease)}
.buschips button:hover{color:var(--ink);border-color:var(--ink-2)}
.buschips button.on{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.buschips button:active{transform:translateY(1px)}
.buschips .play{border-color:var(--accent);color:var(--accent-ink)}
.buschips .play[aria-pressed="true"]{background:var(--wash-2)}
.buswrap{position:relative;touch-action:pan-y;cursor:ew-resize;-webkit-user-select:none;user-select:none;border-radius:8px}
#bussvg{display:block;width:100%;overflow:visible}
#bussvg text{font-family:var(--sans);fill:var(--muted);font-size:12px}
#bussvg .axl{stroke:var(--line);stroke-width:1}
#bussvg .axg{stroke:var(--grid);stroke-width:1}
#bussvg .stg rect{fill:var(--surface-2)}
#bussvg .stg text{fill:var(--ink-2);font-weight:600}
#bussvg .stg.on rect{fill:var(--wash-2)}
#bussvg .stg.on text{fill:var(--accent-ink)}
#bussvg .lname{fill:var(--ink);font-family:var(--serif);font-weight:700;font-size:14px}
#bussvg .seg{stroke:var(--bg);stroke-width:1.5}
#bussvg .slab{font-size:12px;font-weight:500;pointer-events:none;paint-order:stroke;stroke-width:3px;stroke-linejoin:round}
#bussvg .slab.dk{fill:#fff;stroke:rgba(0,0,0,.55)}
#bussvg .slab.lt{fill:#14160F;stroke:rgba(255,255,255,.6)}
#bussvg .none{fill:none;stroke:var(--line);stroke-dasharray:3 4}
#bussvg .unk{stroke:var(--muted)}
#bussvg .mk{fill:var(--bg);stroke:var(--ink);stroke-width:1.5;cursor:pointer;transition:r .3s var(--ease)}
#bussvg .mk:hover,#bussvg .mk:focus{fill:var(--accent);outline:none}
#bussvg .brk{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
#bussvg .cur line{stroke:var(--accent-ink);stroke-width:2}
#bussvg .cur rect{fill:var(--fill)}
#bussvg .cur text{fill:var(--on-fill);font-weight:700;font-size:12px}
#bussvg .cur circle{fill:var(--accent-ink)}
.busread{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.busread li{min-width:0;padding:12px;border-radius:8px;background:var(--surface-2)}
.busread .bn{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font:700 14px/20px var(--serif);color:var(--ink)}
.busread .bn small{font:400 12px/16px var(--sans);color:var(--muted);white-space:nowrap}
.busread svg{display:block;width:100%;height:32px;margin:8px 0;border-radius:4px}
.busread .bl{font-size:14px;line-height:20px;color:var(--ink-2);min-height:40px}
.busread .bm{display:block;font-size:12px;line-height:16px;color:var(--muted);margin-top:4px}
.busread li.chg{animation:chg .6s var(--ease)}
@keyframes chg{0%{box-shadow:inset 0 0 0 2px var(--accent)}100%{box-shadow:inset 0 0 0 2px transparent}}

/* ---------- 透镜列表（FLIP 重排 + 行内展开） */
.lwrap{position:relative}
.lensbar{position:sticky;top:var(--nav-h);z-index:8;display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:12px var(--gut);margin:0 calc(var(--gut) * -1) 8px;background:var(--nav-glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--glass-line)}
.lensk{font:600 12px/16px var(--sans);color:var(--muted);letter-spacing:.08em}
.lens{position:relative;display:inline-flex;padding:4px;border-radius:9999px;background:var(--surface-2)}
.lens .pill{position:absolute;left:0;top:4px;bottom:4px;width:40px;border-radius:9999px;background:var(--fill);will-change:transform,width}
.lens button{position:relative;z-index:1;font:500 14px/20px var(--sans);padding:6px 16px;border:0;border-radius:9999px;background:transparent;color:var(--ink-2);cursor:pointer;transition:color .3s var(--ease)}
.lens button:hover{color:var(--ink)}
.lens button[aria-selected="true"]{color:var(--on-fill);font-weight:600}
.lensnote{font-size:12px;line-height:16px;color:var(--muted)}
.lcols,.lhead{display:grid;grid-template-columns:11em minmax(0,1fr) 72px 72px 16px;gap:16px}
.nothumb .lcols,.nothumb .lhead{grid-template-columns:9em minmax(0,1fr) 11em 16px}
.lcols{padding:8px;font:500 12px/16px var(--sans);letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line)}
.lgrid{position:relative}
.lgh{display:flex;align-items:baseline;gap:12px;padding:40px 8px 8px;border-bottom:1px solid var(--line)}
.lgh b{font:700 20px/28px var(--serif);color:var(--ink)}
.lgh small{font:500 12px/16px var(--sans);color:var(--muted)}
.lrow{position:relative;border-bottom:1px solid var(--line-2)}
.lhead{appearance:none;border:0;background:transparent;color:inherit;font:inherit;text-align:left;width:100%;align-items:center;padding:12px 8px;cursor:pointer;border-radius:8px;transition:background-color .3s var(--ease)}
.lhead:hover{background:var(--wash)}
.ldate{min-width:0}
.ldate b{display:block;font:700 16px/24px var(--serif);color:var(--accent-ink)}
.ldate small{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.lname{min-width:0}
.lname b{display:block;font:700 18px/28px var(--serif);color:var(--ink)}
.lname small{display:block;font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.lsw{display:flex;height:20px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.lsw i{flex:1 1 0}
.ltags{display:flex;flex-wrap:wrap;gap:4px}
.tg{font:500 12px/16px var(--sans);font-style:normal;padding:2px 8px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tg:first-child{background:var(--wash-2);color:var(--accent-ink)}
.lthumb{display:block;width:72px;height:48px;overflow:hidden;border-radius:6px;background:var(--surface-2)}
.lthumb img{display:block;width:100%;height:100%;object-fit:cover}
.lthumb.none{background:none}
.lchev{width:16px;height:16px;position:relative}
.lchev::before{content:"";position:absolute;left:4px;top:2px;width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .5s var(--ease)}
.lrow.open .lchev::before{transform:translate(0,4px) rotate(-135deg)}
.lmore{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.lrow.open .lmore{grid-template-rows:1fr}
.lmore-in{overflow:hidden;min-height:0;padding:0 8px}
.lmore-in>*:first-child{margin-top:8px}
.lmore-in>*:last-child{margin-bottom:40px}
.lbody{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:start}
.lbody.nophoto{grid-template-columns:minmax(0,1fr)}
.nothumb .lbody{grid-template-columns:minmax(0,1fr) 360px}
.nothumb .lbody.nophoto{grid-template-columns:minmax(0,1fr)}
.lmain{min-width:0;max-width:720px}
.lk{margin:8px 0 4px;font:600 12px/16px var(--sans);letter-spacing:.08em;color:var(--muted)}
.lwhy{font:700 20px/32px var(--serif);color:var(--ink);margin:0 0 16px}
.ltext{font-size:16px;line-height:28px;color:var(--ink-2);margin:0 0 16px}
.cats{margin:0;border-top:1px solid var(--line-2)}
.cats div{display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.cats dt{font:700 14px/24px var(--serif);color:var(--accent-ink)}
.cats dd{margin:0;font-size:14px;line-height:24px;color:var(--ink-2)}
.cols{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;line-height:20px;color:var(--muted)}
.cols i{display:inline-block;width:20px;height:12px;border-radius:2px;margin-right:8px;vertical-align:-1px;box-shadow:0 0 0 1px var(--line)}
.lconf{margin:16px 0 0}
.jump{margin:16px 0 0;font-size:14px}
.lpics{min-width:0}
.ph{margin:0}
.ph img{display:block;width:100%;height:auto;background:var(--surface)}
.ph.big img{max-height:560px;object-fit:contain;background:var(--surface)}
.ph figcaption{margin-top:8px;font-size:12px;line-height:20px;color:var(--muted)}
.ph figcaption .cr{display:block}
.lpics2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px;align-items:start}
.lpics2 .ph img{aspect-ratio:4/3;object-fit:cover}
.lrow.flash .lhead{box-shadow:inset 0 0 0 2px var(--accent)}
/* 谁影响了谁 */
.flows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.flows li{display:grid;grid-template-columns:7em 13em minmax(0,1fr);gap:16px;padding:12px 8px;border-bottom:1px solid var(--line-2);align-items:baseline}
.fy{font:700 16px/24px var(--serif);color:var(--accent-ink)}
.fd{font:700 16px/24px var(--serif);color:var(--ink)}
.fd i{font-style:normal;color:var(--accent);margin:0 8px}
.fw{font-size:14px;line-height:24px;color:var(--ink-2)}

/* ---------- 折叠与卷末 */
details.fold{margin:0;border-top:1px solid var(--line)}
details.fold>summary{cursor:pointer;list-style:none;padding:16px 0;display:flex;align-items:center;gap:12px;color:var(--ink-2);transition:color .3s var(--ease)}
details.fold>summary:hover{color:var(--ink)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"+";font:600 16px/1 var(--sans);color:var(--accent);width:16px;flex:none;text-align:center}
details.fold[open]>summary::before{content:"−"}
details.fold>summary h3{margin:0;font-size:24px;line-height:32px;display:inline}
details.fold>:not(summary){padding:0 0 24px}
.endm{padding:96px 0 64px;border-top:1px solid var(--line)}
.endm h2{font-size:48px;line-height:56px;margin-bottom:40px}
.method{max-width:720px;font-size:14px;line-height:24px;color:var(--ink-2)}
.method p b{display:block;font:700 16px/24px var(--serif);color:var(--ink);margin-bottom:4px}
.refs{columns:2;column-gap:48px;font-size:14px;line-height:24px;color:var(--ink-2)}
.refs h3{font-size:16px;line-height:24px;margin:16px 0 8px;break-after:avoid}
.refs ul{margin:0 0 16px;padding:0;list-style:none}
.refs li{margin:0 0 8px;overflow-wrap:anywhere;break-inside:avoid;scroll-margin-top:120px}
.refs li:target{background:var(--wash-2);box-shadow:0 0 0 4px var(--wash-2);border-radius:2px}
.refs li b{color:var(--muted);font-weight:500}
.refs a{color:var(--ink-2)}
.tscroll{overflow-x:auto}
.tscroll table{border-collapse:collapse;width:100%;font-size:12px;line-height:20px}
.tscroll td,.tscroll th{border-bottom:1px solid var(--line-2);padding:8px;text-align:left;vertical-align:top;color:var(--ink-2)}
.tscroll th{font-weight:500;color:var(--muted)}
.catt{min-width:760px}
.catt td:first-child{width:12em}
.catt td b{display:block;font:700 14px/20px var(--serif);color:var(--ink)}
.catt td small{display:block;color:var(--muted)}
.credits table{min-width:640px}
.credits td:first-child{min-width:16em}
.foot{margin:40px 0 0;font-size:12px;line-height:20px;color:var(--muted)}
/* 大图 */
.lb{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100vw;height:100vh;height:100dvh;color:#EFEBDD}
.lb::backdrop{background:rgba(6,7,4,.92)}
.lb[open]{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:48px 16px 24px}
.lb img{max-width:100%;max-height:calc(100% - 64px);width:auto;height:auto;object-fit:contain;border-radius:4px}
.lb p{margin:0;max-width:820px;font-size:12px;line-height:20px;color:#C8C4B2;text-align:center}
.lbx{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(239,235,221,.12);color:#EFEBDD;font:400 24px/1 var(--sans);cursor:pointer}

@media (max-width:1100px){
  .h3t{font-size:80px}
  .chead h2{font-size:48px}
  .tlcard{width:360px}
  .tlplate{left:calc(clamp(16px,3vw,40px) + 360px + 32px)}
  .busread{grid-template-columns:repeat(3,minmax(0,1fr))}
  .nothumb .lbody{grid-template-columns:minmax(0,1fr) 280px}
}
@media (max-width:980px){
  .plate{grid-template-columns:minmax(0,1fr);gap:24px}
  .ptext{padding-bottom:0}
  .refs{columns:1}
  .lcols{display:none}
  .lhead{grid-template-columns:minmax(0,1fr) 56px 16px;row-gap:4px}
  .lhead .ldate{grid-column:1/-1}
  .lhead .lsw{display:none}
  .lthumb{width:56px;height:40px}
  .nothumb .lhead{grid-template-columns:minmax(0,1fr) 16px}
  .nothumb .lhead .ltags{grid-column:1/-1;grid-row:3}
  .ldate b,.ldate small{display:inline}
  .ldate small{margin-left:8px}
  .lbody,.nothumb .lbody{grid-template-columns:minmax(0,1fr);gap:24px}
  .flows li{grid-template-columns:5.5em minmax(0,1fr)}
  .flows .fw{grid-column:1/-1}
  /* 舞台：上图、中卡、下尺 */
  .tlstage{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto}
  .tlstage>*{min-width:0}
  .tlbg{inset:-48px}
  .tlplate{position:relative;left:auto;right:auto;top:auto;bottom:auto;padding:16px 16px 8px;min-height:0}
  .tlcap{margin-top:8px;min-height:16px}
  .tlcap .cs{-webkit-line-clamp:1}
  .tlcap .cr,.tlhint{display:none}
  .tlcard{position:relative;left:auto;bottom:auto;width:auto;max-height:none;border-radius:0;border-left:0;border-right:0;box-shadow:none;background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none;padding:12px 16px}
  .tlname{margin-top:4px;font-size:24px;line-height:32px}
  .tltext{margin-top:4px;font-size:14px;line-height:24px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tlrows{margin-top:8px}
  .tlrows button{padding:4px;grid-template-columns:3.2em 48px minmax(0,1fr);gap:8px}
  .tlrows em{font-size:12px}
  .tlruler{position:relative;left:auto;right:auto;bottom:auto;border-radius:0;border-left:0;border-right:0;box-shadow:none;background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;--ruler-h:72px}
}
@media (max-width:700px){
  .h3t{font-size:60px}.h3s{font:500 20px/32px var(--serif)}.h3in{padding-bottom:96px}.h3a{margin-top:32px}.h3cap{left:16px;right:16px;bottom:12px;text-align:left;max-width:none}
  .tagl{font-size:36px}.tagrest>p{font-size:16px;line-height:28px}.tagrest{margin-top:32px}.tnums{grid-template-columns:minmax(0,1fr);gap:16px;margin-top:32px}.tn b{font-size:36px;line-height:40px}
  .chap{padding:64px 0 32px}
  .chead{margin-bottom:40px}
  .chead h2,.tlintro h2{font-size:36px;line-height:44px}
  .chead .lede,.tlintro .lede{font-size:16px;line-height:28px;margin-top:16px}
  .tlintro{padding-top:64px;padding-bottom:32px}
  .sech h3{font-size:30px;line-height:36px}
  .tool{padding:16px;margin:0 -8px}
  .busyr b{font-size:48px}
  .busread{grid-template-columns:minmax(0,1fr);gap:8px}
  .busread li{display:grid;grid-template-columns:3.5em 64px minmax(0,1fr);gap:12px;align-items:center;padding:8px 12px}
  .busread .bn{display:block}.busread .bn small{display:block}
  .busread svg{margin:0;height:28px}
  .busread .bl{min-height:0}
  .lpics2{grid-template-columns:minmax(0,1fr)}
  .endm h2{font-size:36px;line-height:44px}
  details.fold>summary h3{font-size:20px;line-height:28px}
  .cats div{grid-template-columns:3.5em minmax(0,1fr);gap:12px}
}
@media (max-aspect-ratio:4/5){.h3img img{object-position:40% 50%}}
@media (max-height:760px) and (min-width:981px){.tltext{font-size:14px;line-height:24px}.tlname{font-size:30px;line-height:36px}.tlrows button{padding:4px}}
@media (prefers-reduced-transparency:reduce){.glass,.cnav,.lensbar{-webkit-backdrop-filter:none;backdrop-filter:none}.glass{background:#14160F}.cnav,.lensbar{background:var(--bg)}}
@media (prefers-contrast:more){.glass{background:#000;border-color:#EFEBDD;-webkit-backdrop-filter:none;backdrop-filter:none}.cnav{background:var(--bg);border-bottom-color:var(--ink)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .fade,.rise{opacity:1;transform:none}
  .h3img img{animation:none;transform:none}
  .tagsec{height:auto}.tagstick{position:static;height:auto;padding:96px 0}.tagl .w{color:#EFEBDD;animation:none}.tagrest{opacity:1;transform:none}
}
@media print{.cnav,.tlruler,.ntheme,.buschips{display:none}.fade,.rise{opacity:1;transform:none}.tagsec{height:auto}.tagstick{position:static;height:auto}.tagl .w{color:#EFEBDD}.tagrest{opacity:1;transform:none}.tlpin{height:auto!important}.tlstage{position:relative;height:70vh}.lmore{grid-template-rows:1fr}}
</style>
</head>
