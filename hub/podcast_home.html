<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{POD_NAME}} · 播客 — 天杰</title>
<meta name="description" content="{{POD_TAGLINE}}">
<meta name="author" content="Tianjie Sun">
<meta name="theme-color" content="#f3f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="{{BASE}}/listen/">
<link rel="alternate" type="application/rss+xml" title="{{POD_NAME}}" href="/listen/feed.xml">
<meta property="og:type" content="website">
<meta property="og:title" content="{{POD_NAME}} · 播客">
<meta property="og:description" content="{{POD_TAGLINE}}">
<meta property="og:url" content="{{BASE}}/listen/">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:locale" content="zh_CN">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%231f5f63'/%3E%3Cpath d='M26 20v24l20-12z' fill='%23fff'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('yzyt-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap"></noscript>
<style>
/* 播客区：沿用站点的纸面灰与衬线标题，强调色换成播客自己的青墨色 */
:root{--bg:#f3f4ef;--surface:#fbfbf8;--surface-2:#eceee6;--ink:#1c1e1a;--ink-2:#4c4f49;--muted:#7d817a;--line:#d8dad2;--line-2:#c5c8bf;--accent:#1f5f63;--accent-soft:#dbe8e7;--accent-ink:#fff;--shadow:0 14px 40px rgba(28,30,26,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16181b;--surface:#1e2125;--surface-2:#262a2f;--ink:#ecebe4;--ink-2:#b9bbb3;--muted:#8b8e88;--line:#33373c;--line-2:#444950;--accent:#7fc2c3;--accent-soft:#1f3334;--accent-ink:#121416;--shadow:0 14px 40px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16181b;--surface:#1e2125;--surface-2:#262a2f;--ink:#ecebe4;--ink-2:#b9bbb3;--muted:#8b8e88;--line:#33373c;--line-2:#444950;--accent:#7fc2c3;--accent-soft:#1f3334;--accent-ink:#121416;--shadow:0 14px 40px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;text-wrap:balance;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 56px}
@media (min-width:900px){.wrap{padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:max(36px,env(safe-area-inset-right,0px))}}

.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;padding-block:26px 18px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:flex-end;gap:16px}
.seal{writing-mode:vertical-rl;font-family:"Noto Serif SC",serif;font-weight:900;font-size:13px;letter-spacing:.35em;color:var(--accent-ink);background:var(--accent);padding:12px 7px;line-height:1;border-radius:2px}
.brand h1{font-size:clamp(36px,6vw,58px);font-weight:900;letter-spacing:.12em;line-height:1}
.brand .tg{font-size:13.5px;color:var(--ink-2);max-width:46ch;margin-top:10px}
.nav{display:flex;gap:18px;font-size:13.5px;align-items:center;flex-wrap:wrap}
.nav a{text-decoration:none;color:var(--ink-2);letter-spacing:.06em}
.nav a:hover{color:var(--accent)}
.theme-btn{font:inherit;font-size:12px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;background:var(--surface);cursor:pointer}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}

.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,1fr);gap:32px;align-items:center;padding-block:34px 40px;border-bottom:1px solid var(--line)}
.hero-cv{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);aspect-ratio:1200/630;max-width:100%}
.hero-cv img{width:100%;height:100%;object-fit:cover}
.kicker{font-size:12.5px;letter-spacing:.2em;color:var(--accent);font-weight:500}
.hero h2{font-size:clamp(26px,3.4vw,38px);font-weight:900;letter-spacing:.04em;line-height:1.25;margin-top:10px}
.hero h2 a{text-decoration:none}
.hero .sub{font-family:"Noto Serif SC",serif;font-size:17px;color:var(--ink-2);margin-top:6px}
.hero p{color:var(--ink-2);margin:14px 0 0;max-width:58ch}
.cta{display:flex;align-items:center;gap:16px;margin-top:22px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);text-decoration:none;padding:10px 18px;border-radius:999px;font-size:14.5px;font-weight:500;letter-spacing:.04em}
.btn:hover{background:var(--accent);color:var(--accent-ink)}
.btn svg{width:14px;height:14px;fill:currentColor}
.meta{font-size:13px;color:var(--muted)}

.about{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:32px;padding-block:28px;border-bottom:1px solid var(--line)}
.about p{margin:0 0 10px;color:var(--ink-2);max-width:62ch}
.about .sub-h{font-size:12.5px;letter-spacing:.2em;color:var(--muted);margin-bottom:8px}
.subs{display:grid;gap:8px}
.subs a{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:14px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.subs a:hover{border-color:var(--accent)}
.subs code{font-size:12px;color:var(--muted);word-break:break-all}

.sec{margin-top:40px}
.sec-h{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:18px}
.sec-h h2{font-size:22px;font-weight:900;letter-spacing:.08em}
.sec-h span{color:var(--muted);font-size:13px}
.eps{display:grid;gap:14px}
.ep{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;padding:14px;transition:border-color .2s}
.ep:hover{border-color:var(--accent)}
.ep .cv{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.ep .cv img{width:100%;height:100%;object-fit:cover}
.ep .no{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:500}
.ep .no time{color:var(--muted);margin-left:8px;letter-spacing:.04em}
.ep h3{font-size:20px;font-weight:900;letter-spacing:.03em;line-height:1.3;margin-top:4px}
.ep p{margin:6px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags span,.tags i{font-style:normal;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.tags i{border:1px solid var(--line-2);background:transparent}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--muted)}
footer a{color:var(--ink-2);text-decoration:none}footer a:hover{color:var(--accent)}
@media (max-width:820px){.hero,.about{grid-template-columns:1fr;gap:20px}.mast{align-items:flex-start}.brand{align-items:flex-start}.seal{writing-mode:horizontal-tb;letter-spacing:.3em;padding:6px 10px}.ep{grid-template-columns:96px 1fr;gap:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="brand">
      <div class="seal">播客</div>
      <div><h1>{{POD_NAME}}</h1><div class="tg">{{POD_TAGLINE}}</div></div>
    </div>
    <nav class="nav"><a href="#episodes">全部节目</a><a href="/listen/feed.xml">RSS</a><a href="/">一周一题 →</a><button class="theme-btn" id="themebtn" type="button" aria-label="切换深浅色">◐ 深浅色</button></nav>
  </header>

  {{HERO}}

  <section class="about">
    <div>
      <div class="sub-h">关于这个播客</div>
      {{POD_ABOUT}}
    </div>
    <div>
      <div class="sub-h">订阅</div>
      <div class="subs">
        <a href="/listen/feed.xml"><span>RSS 地址（粘贴到播客客户端）</span></a>
        <a href="#episodes"><span>或直接在网页里听，进度会记住</span></a>
      </div>
    </div>
  </section>

  <section class="sec" id="episodes">
    <div class="sec-h"><h2>全部节目</h2><span>共 {{COUNT}} 期</span></div>
    <div class="eps">{{EPISODES}}</div>
  </section>

  <footer><span>© {{YEAR}} Tianjie Sun</span><a href="/listen/feed.xml">播客 RSS</a><a href="/">一周一题</a><a href="/sitemap.xml">Sitemap</a></footer>
</div>
<script>
(function(){var r=document.documentElement,b=document.getElementById('themebtn');if(!b)return;function L(){var t=r.getAttribute('data-theme');b.textContent=t==='dark'?'☀ 浅色':t==='light'?'☾ 深色':'◐ 深浅色'}
b.addEventListener('click',function(){var d=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);r.setAttribute('data-theme',d?'light':'dark');try{localStorage.setItem('yzyt-theme',r.getAttribute('data-theme'))}catch(e){}L()});L()})();
</script>
</body>
</html>
