<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{SITE_NAME}}</title>
<meta name="description" content="{{TAGLINE}}">
<meta name="author" content="Tianjie Sun">
<meta name="theme-color" content="#f3f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="{{BASE}}/">
<link rel="alternate" type="application/atom+xml" title="{{SITE_NAME}}" href="/feed.xml">
<meta property="og:type" content="website">
<meta property="og:title" content="{{SITE_NAME}}">
<meta property="og:description" content="{{TAGLINE}}">
<meta property="og:url" content="{{BASE}}/">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:locale" content="zh_CN">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23b5432c'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='Noto Serif SC,Songti SC,serif' font-weight='900' fill='%23fff'%3E题%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('yzyt-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap"></noscript>
<style>
:root{--bg:#f3f4ef;--surface:#fbfbf8;--surface-2:#eceee6;--ink:#1c1e1a;--ink-2:#4c4f49;--muted:#7d817a;--line:#d8dad2;--line-2:#c5c8bf;--accent:#b5432c;--accent-ink:#fff;--shadow:0 14px 40px rgba(28,30,26,.12)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16181b;--surface:#1e2125;--surface-2:#262a2f;--ink:#ecebe4;--ink-2:#b9bbb3;--muted:#8b8e88;--line:#33373c;--line-2:#444950;--accent:#e2694f;--accent-ink:#1a1a1a;--shadow:0 14px 40px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#16181b;--surface:#1e2125;--surface-2:#262a2f;--ink:#ecebe4;--ink-2:#b9bbb3;--muted:#8b8e88;--line:#33373c;--line-2:#444950;--accent:#e2694f;--accent-ink:#1a1a1a;--shadow:0 14px 40px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;text-wrap:balance;margin:0}
.wrap{max-width:1160px;margin:0 auto;padding-inline:clamp(16px,3vw,36px);padding-block:8px 56px}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;padding-block:26px 18px;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:flex-end;gap:16px}
.seal{writing-mode:vertical-rl;font-family:"Noto Serif SC",serif;font-weight:900;font-size:13px;letter-spacing:.35em;color:var(--accent-ink);background:var(--accent);padding:12px 7px;line-height:1;border-radius:2px}
.brand h1{font-size:clamp(40px,6vw,64px);font-weight:900;letter-spacing:.12em;line-height:1}
.brand .tg{font-size:13.5px;color:var(--ink-2);max-width:46ch;margin-top:10px}
.nav{display:flex;gap:18px;font-size:13.5px;align-items:center}
.nav a{text-decoration:none;color:var(--ink-2);letter-spacing:.06em}
.nav a:hover{color:var(--accent)}
.theme-btn{font:inherit;font-size:12px;color:var(--ink-2);border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;background:var(--surface);cursor:pointer}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:32px;align-items:center;padding-block:34px 40px;border-bottom:1px solid var(--line)}
.hero-cv{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);aspect-ratio:1200/630}
.hero-cv img{width:100%;height:100%;object-fit:cover}
.kicker{font-size:12.5px;letter-spacing:.2em;color:var(--accent);font-weight:500}
.hero h2{font-size:clamp(28px,3.4vw,40px);font-weight:900;letter-spacing:.04em;line-height:1.25;margin-top:10px}
.hero h2 a{text-decoration:none}
.hero .sub{font-family:"Noto Serif SC",serif;font-size:17px;color:var(--ink-2);margin-top:6px}
.hero p{color:var(--ink-2);margin:14px 0 0;max-width:58ch}
.cta{display:flex;align-items:center;gap:16px;margin-top:22px}
.btn{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;padding:10px 18px;border-radius:999px;font-size:14.5px;font-weight:500;letter-spacing:.04em}
.btn:hover{background:var(--accent);color:var(--accent-ink)}
.meta{font-size:13px;color:var(--muted)}

/* sections */
.sec{margin-top:44px}
.sec-h{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:18px}
.sec-h h2{font-size:22px;font-weight:900;letter-spacing:.08em}
.sec-h span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .cv{aspect-ratio:1200/630;background:var(--surface-2)}
.card .cv img{width:100%;height:100%;object-fit:cover}
.card .cb{padding:14px 16px 16px;display:grid;gap:6px}
.card .no{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:500}
.card .no time{color:var(--muted);margin-left:8px;letter-spacing:.04em}
.card h3{font-size:19px;font-weight:900;letter-spacing:.03em;line-height:1.3}
.card p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tags span,.tags i{font-style:normal;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.tags i{border:1px solid var(--line-2);background:transparent}
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.proj{display:grid;gap:4px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none}
.proj:hover{border-color:var(--accent)}
.proj b{font-family:"Noto Serif SC",serif;font-size:17px}
.proj span{font-size:13.5px;color:var(--ink-2)}
.about{max-width:66ch;color:var(--ink-2)}
.about p{margin:0 0 10px}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--muted)}
footer a{color:var(--ink-2);text-decoration:none}footer a:hover{color:var(--accent)}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:20px}.mast{align-items:flex-start}.brand{align-items:flex-start}.seal{writing-mode:horizontal-tb;letter-spacing:.3em;padding:6px 10px;width:max-content}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="brand">
      <div class="seal">每周六更新</div>
      <div><h1>{{SITE_NAME}}</h1><div class="tg">{{TAGLINE}}</div></div>
    </div>
    <nav class="nav"><a href="#archive">归档</a><a href="#projects">长期专题</a><a href="/feed.xml">RSS</a><a href="#about">关于</a><button class="theme-btn" id="themebtn" type="button" aria-label="切换深浅色">◐ 深浅色</button></nav>
  </header>

  {{HERO}}

  <section class="sec" id="archive">
    <div class="sec-h"><h2>归档</h2><span>共 {{COUNT}} 题</span></div>
    <div class="grid">{{ARCHIVE}}</div>
  </section>

  <section class="sec" id="projects">
    <div class="sec-h"><h2>长期专题</h2><span>不按周更新的大项目</span></div>
    <div class="projs">{{PROJECTS}}</div>
  </section>

  <section class="sec about" id="about">
    <div class="sec-h"><h2>关于</h2></div>
    {{ABOUT}}
  </section>

  <footer><span>© {{YEAR}} Tianjie Sun</span><a href="/feed.xml">RSS 订阅</a><a href="/sitemap.xml">Sitemap</a></footer>
</div>
<script>
(function(){var r=document.documentElement,b=document.getElementById('themebtn');if(!b)return;function L(){var t=r.getAttribute('data-theme');b.textContent=t==='dark'?'☀ 浅色':t==='light'?'☾ 深色':'◐ 深浅色'}
b.addEventListener('click',function(){var d=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);r.setAttribute('data-theme',d?'light':'dark');try{localStorage.setItem('yzyt-theme',r.getAttribute('data-theme'))}catch(e){}L()});L()})();
</script>
</body>
</html>
