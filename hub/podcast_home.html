<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{POD_NAME}} · 播客 — 天杰</title>
<meta name="description" content="{{POD_TAGLINE}}">
<link rel="canonical" href="{{BASE}}/listen/">
<link rel="alternate" type="application/rss+xml" title="{{POD_NAME}}" href="/listen/feed.xml">
<meta property="og:type" content="website">
<meta property="og:title" content="{{POD_NAME}} · 播客">
<meta property="og:description" content="{{POD_TAGLINE}}">
<meta property="og:url" content="{{BASE}}/listen/">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%2304122A'/%3E%3Cpath d='M24 18v28l22-14z' fill='%2377C2EF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"></noscript>
<script>try{var t=localStorage.getItem('yzyt-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
{{SKIN}}
.hero .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.hero h1{font-size:96px}
.hero .hfig img{aspect-ratio:16/10;object-fit:cover}
.hero .latest{margin:0 0 12px;font:500 14px/20px var(--sans);letter-spacing:.08em;color:var(--accent-ink)}
.eps{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.eps li{border-bottom:1px solid var(--line)}
.eps a{display:grid;grid-template-columns:120px 160px minmax(0,1fr);gap:24px;align-items:center;padding:24px 0;text-decoration:none;color:inherit;transition:background-color .3s var(--ease)}
.eps a:hover{background:var(--wash);margin:0 calc(var(--gut) * -1);padding-left:var(--gut);padding-right:var(--gut)}
.eps .d{font:500 14px/20px var(--sans);color:var(--muted);letter-spacing:.04em}
.eps .d b{display:block;font:700 24px/28px var(--serif);color:var(--accent-ink);letter-spacing:0}
.eps .cv{width:160px;aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--surface)}
.eps .cv img{display:block;width:100%;height:100%;object-fit:cover}
.eps h3{font-size:24px;line-height:32px}
.eps p{margin:6px 0 0;font:400 15px/24px var(--sans);color:var(--ink-2);max-width:48em}
.eps .meta{margin:8px 0 0;font:400 13px/20px var(--sans);color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 16px}
.about{max-width:48em;font:400 16px/28px var(--sans);color:var(--ink-2)}
.about p{margin:0 0 12px}
.subs{display:flex;flex-wrap:wrap;gap:12px 24px;margin:16px 0 0;font:500 14px/24px var(--sans)}
@media (max-width:980px){.hero .grid{grid-template-columns:minmax(0,1fr)}.hero h1{font-size:60px}}
@media (max-width:700px){.hero h1{font-size:48px}.eps a{grid-template-columns:96px minmax(0,1fr);gap:16px}.eps .d{grid-column:1/-1}.eps .cv{width:96px}.eps h3{font-size:20px;line-height:28px}}
</style>
</head>
<body>
<div class="sitebar"><div class="wide"><a class="brand" href="/">孙天杰</a><span class="tag">合读</span><span class="dt">播客 · 共 {{COUNT}} 期</span><div class="r"><a href="#episodes">全部节目</a><a href="/listen/feed.xml">RSS</a><a href="/cc/">CC 读书会</a></div></div></div>

<header class="band hero">
  <div class="wide grid">
    <div>
      <p class="hk">{{POD_NAME}} · 播客</p>
      <h1>{{POD_NAME}}</h1>
      <p class="hsub">{{POD_TAGLINE}}</p>
      {{HERO}}
    </div>
    {{HERO_FIG}}
  </div>
</header>

<nav class="cnav" aria-label="章节"><div class="row" id="cnav">
  <a href="#episodes"><small>0</small>全部节目</a>
  <a href="#about"><small>1</small>关于</a>
  <button class="ntheme" id="themebtn" type="button">白天读</button>
  <i class="prog" id="pageprog"></i>
</div></nav>

<main>
<section class="chap" id="episodes">
  <div class="wide">
    <div class="chead"><p class="cno">00 · 全部节目<span class="trail"></span></p><h2>共 {{COUNT}} 期</h2></div>
    <ul class="eps">{{EPISODES}}</ul>
  </div>
</section>
<section class="endm" id="about">
  <div class="wide">
    <h2>关于</h2>
    <div class="about">{{POD_ABOUT}}
      <div class="subs"><a href="/listen/feed.xml">RSS 地址（粘贴到播客客户端）</a><a href="#episodes">或直接在网页里听，进度会记住</a></div>
    </div>
    <div class="seal"><span>© {{YEAR}} Tianjie Sun</span><a href="/listen/feed.xml">播客 RSS</a><a href="/t/">一周一题</a><a href="/cc/">CC 读书会</a></div>
  </div>
</section>
</main>
<script>
(function(){
const $=s=>document.querySelector(s);
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll(".rise").forEach(el=>io.observe(el));
const navA=[...document.querySelectorAll("#cnav a")],secs=navA.map(a=>document.querySelector(a.getAttribute("href"))).filter(Boolean);
const upnav=()=>{let k=0;secs.forEach((s,i)=>{if(s.getBoundingClientRect().top-64<=0)k=i});navA.forEach((a,i)=>a.classList.toggle("on",i===k));const d=document.documentElement;$("#pageprog").style.transform=`scaleX(${Math.min(1,Math.max(0,d.scrollTop/(d.scrollHeight-innerHeight||1)))})`};
addEventListener("scroll",upnav,{passive:true});upnav();
const r=document.documentElement,b=$("#themebtn");function L(){b.textContent=r.getAttribute("data-theme")==="light"?"夜里读":"白天读"}
b.addEventListener("click",()=>{r.setAttribute("data-theme",r.getAttribute("data-theme")==="light"?"dark":"light");try{localStorage.setItem("yzyt-theme",r.getAttribute("data-theme"))}catch(e){}L()});L();
})();
</script>
</body>
</html>
