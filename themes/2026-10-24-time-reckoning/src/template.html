<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}｜一周一题</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="article">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 皮肤「天文台的夜与黄铜」v2（2026-10-30，按第 7 题 v3 的版面系统重排）：
   默认是夜——天文台的深蓝 #0B111D 为底，米白字，黄铜是唯一强调色；卷首、论点、序章是更深的「夜色带」，跟星轨照片接得上。浅色模式是「白天读」：《航海天文年历》的米白纸、墨线、暗黄铜。
   字号只取 12/14/16/18/20/24/30/36/48/60/96/128；间距只取 4/8/12/16/24/32/40/48/64/80/96；字重 400–700；圆角 4/6/8/12/16/全圆。
   背景不用渐变（卷首标题字除外）；卡片只在需要层级时出现。缓动统一 cubic-bezier(.22,1,.36,1)：位移 500 ms，颜色与透明度 300 ms，入场 700 ms；拖动与弹簧由 app.js 驱动。浮在地图上的面板与吸顶导航用半透明材质。 */
:root{
  --bg:#0B111D;--surface:#111A2B;--surface-2:#18233A;
  --ink:#EDE6D3;--ink-2:#C8C1AE;--muted:#8E8C82;
  --line:rgba(237,230,211,.14);--line-2:rgba(237,230,211,.08);--grid:rgba(237,230,211,.05);
  --accent:#D9A441;--accent-2:#B8862B;--accent-ink:#E6BC6A;--wash:rgba(217,164,65,.10);--wash-2:rgba(217,164,65,.2);
  --band-bg:#05080F;--band-surface:#0D1422;--band-surface-2:#152034;--band-ink:#EDE6D3;--band-ink-2:#C8C1AE;--band-muted:#8E8C82;--band-line:rgba(237,230,211,.14);--band-line-2:rgba(237,230,211,.08);--band-accent:#D9A441;--band-accent-2:#B8862B;--band-accent-ink:#E6BC6A;
  --glass:rgba(7,11,20,.64);--glass-line:rgba(237,230,211,.12);--nav-glass:rgba(11,17,29,.72);
  --dial-face:#152034;--dial-night:#05080F;
  --nav-h:48px;--gut:clamp(16px,3.2vw,40px);--ruler-h:64px;--r:16px;
  --ease:cubic-bezier(.22,1,.36,1);
  --serif:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC",serif;
  --sans:"Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
{{LIGHT_BLOCKS}}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--nav-h) + 16px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/28px var(--sans);font-variant-numeric:tabular-nums;overflow-x:hidden;transition:background-color .3s var(--ease),color .3s var(--ease)}
a{color:var(--accent-ink);text-underline-offset:4px;transition:color .3s var(--ease)}
a:focus-visible,button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
h4{font:600 12px/16px var(--sans);margin:16px 0 8px;color:var(--muted);letter-spacing:.08em}
p{margin:0 0 16px;text-wrap:pretty}
button,input,select{font-family:var(--sans)}
img{max-width:100%}
.wide{max-width:1240px;margin:0 auto;padding:0 var(--gut)}
.small{font-size:14px;line-height:24px;color:var(--muted)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.fade{opacity:0;transform:translateY(32px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.fade.in{opacity:1;transform:none}
.conf{display:inline-block;font:500 12px/16px var(--sans);letter-spacing:.04em;padding:2px 8px;border:1px solid var(--line);border-radius:4px;color:var(--muted);vertical-align:1px;white-space:nowrap;margin-left:auto}
.conf.h{border-color:var(--ink-2);color:var(--ink)}
.conf.l{border-style:dashed}
.chip{display:inline-block;font:500 12px/16px var(--sans);padding:4px 8px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;border-radius:4px;text-decoration:none}
.src{font-size:12px;line-height:20px;color:var(--muted);margin:8px 0 0}
.src a{color:var(--muted)}
.src a:hover{color:var(--accent-ink)}
.dispute{margin:16px 0 0;padding:12px 16px;border-radius:8px;font-size:14px;line-height:24px;color:var(--ink-2);background:var(--wash)}
.dispute b{color:var(--accent-ink);font-weight:600;margin-right:8px}
.lamp{display:inline-block;flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px 1px var(--accent);margin-right:8px}
.lamp.dim,.lamp.off{background:var(--line);box-shadow:none}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 24px 48px -24px rgba(0,0,0,.6)}

/* ---------- 夜色带（卷首、论点、序章）：不随深浅色切换 */
.band{--bg:var(--band-bg);--surface:var(--band-surface);--surface-2:var(--band-surface-2);--ink:var(--band-ink);--ink-2:var(--band-ink-2);--muted:var(--band-muted);--line:var(--band-line);--line-2:var(--band-line-2);--accent:var(--band-accent);--accent-2:var(--band-accent-2);--accent-ink:var(--band-accent-ink);--wash:rgba(217,164,65,.10);--wash-2:rgba(217,164,65,.2);--grid:rgba(237,230,211,.05);--glass:rgba(7,11,20,.64);--glass-line:rgba(237,230,211,.12);--dial-face:#152034;--dial-night:#05080F;background:var(--bg);color:var(--ink);color-scheme:dark}

/* ---------- 卷首：一张全幅实拍，一句标题，一个动作 */
.h3{position:relative;min-height:max(calc(100dvh - 36px),630px);display:flex;flex-direction:column;justify-content:center;overflow:hidden;background:#05080F;color:#fff;isolation:isolate}
.h3img{position:absolute;inset:0;margin:0;z-index:-1;background:#05080F}
.h3img img{display:block;width:100%;height:100%;object-fit:cover;object-position:62% 30%;transform:scale(1.06);animation:h3zoom 2.4s var(--ease) .1s forwards}
.h3img::after{content:"";position:absolute;inset:0;background:rgba(5,8,15,.38)}
@keyframes h3zoom{to{transform:scale(1)}}
.h3in{width:100%;padding-top:48px;padding-bottom:176px}
.h3k{margin:0;font:500 14px/20px var(--sans);letter-spacing:.08em;color:rgba(255,255,255,.78)}
.h3t{margin:16px 0 0;font:700 128px/1 var(--serif);letter-spacing:-.01em;max-width:680px;background:linear-gradient(90deg,#FFFFFF 0%,#9B9B9B 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:nowrap}
.h3s{margin:24px 0 0;font:500 24px/32px var(--serif);color:rgba(255,255,255,.9);max-width:680px;text-shadow:0 1px 12px rgba(0,0,0,.5)}
.h3s span{display:block}
.h3a{margin:40px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 16px 12px 24px;border-radius:9999px;background:#fff;color:#0B0B0B;font:600 16px/24px var(--sans);text-decoration:none;transition:transform .3s var(--ease),background-color .3s var(--ease)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s var(--ease)}
.btn:hover{background:#F1E8D2}
.btn:hover svg{transform:translateY(2px)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid #D9A441;outline-offset:4px}
.h3p{font:400 14px/20px var(--sans);color:rgba(255,255,255,.78);text-shadow:0 1px 8px rgba(0,0,0,.5)}
.h3cap{position:absolute;right:24px;bottom:16px;margin:0;max-width:440px;font:400 12px/16px var(--sans);color:rgba(255,255,255,.6);text-align:right}
.rise{opacity:0;transform:translateY(32px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rise.in{opacity:1;transform:none}
/* 论点：一句话，逐词点亮（词亮起时像黄铜灯先暖后定） */
.tagsec{position:relative;height:240vh;background:var(--band-bg)}
.tagstick{position:sticky;top:0;height:100vh;display:flex;align-items:center}
.tagstick>.wide{width:100%}
.tagl{margin:0;font:700 60px/1.25 var(--serif);letter-spacing:-.01em;max-width:680px}
.tagl .ln{display:block}
.tagl .w{color:rgba(237,230,211,.24);transition:color .5s var(--ease)}
.tagl .w.on{color:#EDE6D3;animation:lamp 1.6s var(--ease)}
@keyframes lamp{0%{color:#FFE2A6;text-shadow:0 0 32px rgba(217,164,65,.9),0 0 4px rgba(255,226,166,.8)}100%{color:#EDE6D3;text-shadow:0 0 0 rgba(217,164,65,0)}}
.tagrest{margin:40px 0 0;max-width:820px;opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.tagrest.on{opacity:1;transform:none}
.tagrest>p{margin:0;max-width:680px;font:400 18px/32px var(--sans);color:#C8C1AE}
.tnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;margin:48px 0 0}
.tn b{display:block;font:700 36px/40px var(--serif);color:#EDE6D3;letter-spacing:-.01em;white-space:nowrap}
.tn b small{font:500 14px/20px var(--sans);color:#D9A441;margin-left:8px;letter-spacing:.04em}
.tn p{margin:8px 0 0;font:400 14px/24px var(--sans);color:#8E8C82}
@media (max-width:1100px){.h3t{font-size:96px}}
@media (max-width:700px){.h3t{font-size:60px}.h3s{font:500 20px/28px var(--serif)}.h3in{padding-top:32px;padding-bottom:208px}.h3a{margin-top:32px}.h3cap{left:16px;right:16px;bottom:12px;text-align:left;max-width:none}.h3img img{object-position:66% 30%}.tagl{font-size:36px;line-height:1.3}.tagrest>p{font-size:16px;line-height:28px}.tagrest{margin-top:32px}.tnums{grid-template-columns:minmax(0,1fr);gap:24px;margin-top:32px}.tn b{font-size:30px;line-height:36px}}

/* ---------- 章节导航：浮在内容上的半透明条 */
.cnav{position:sticky;top:0;z-index:30;background:var(--nav-glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--glass-line)}
.cnav .row{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:1240px;margin:0 auto;padding:0 calc(var(--gut) - 12px);position:relative}
.cnav .row::-webkit-scrollbar{display:none}
.cnav a{flex:none;padding:12px;font-size:14px;line-height:22px;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;transition:color .3s var(--ease),border-color .3s var(--ease)}
.cnav a:hover{color:var(--ink)}
.cnav a small{font:700 12px/16px var(--serif);margin-right:8px;color:var(--accent-ink)}
.cnav a.on{color:var(--ink);border-bottom-color:var(--accent)}
.cnav .prog{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--accent);opacity:.5;transform-origin:0 50%;transform:scaleX(0)}
.ntheme{flex:none;margin-left:auto;align-self:center;font:500 14px/20px var(--sans);color:var(--muted);background:none;border:0;padding:8px 12px;border-radius:9999px;cursor:pointer;white-space:nowrap;transition:color .3s var(--ease),background-color .3s var(--ease)}
.ntheme:hover{color:var(--ink);background:var(--wash)}
.ntheme:active{transform:translateY(1px)}

/* ---------- 章：每章一张「图版」开篇（左字右图），图不压字 */
.chap{padding:96px 0 48px}
.chead{margin-bottom:80px}
.plate{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:end}
.ptext{padding-bottom:40px}
.cno{margin:0 0 16px;font:500 14px/20px var(--sans);letter-spacing:.12em;color:var(--accent-ink)}
.chead h2{font-size:60px;line-height:1.1}
.chead .lede{margin:24px 0 0;max-width:32em;font-size:18px;line-height:32px;color:var(--ink-2)}
.pimg{margin:0}
.pimg img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:4px;background:var(--surface)}
.pimg figcaption{margin-top:12px;font-size:12px;line-height:20px;color:var(--muted)}
/* 章内的小节：一个标题、一句导语，然后是图或列表 */
.sec{margin:0 0 96px}
.sech{margin:0 0 32px;max-width:680px}
.sech .k{display:block;font:600 12px/16px var(--sans);letter-spacing:.12em;color:var(--accent-ink);margin:0 0 12px}
.sech h3{font-size:36px;line-height:40px}
.sech p{margin:16px 0 0;font-size:16px;line-height:28px;color:var(--ink-2)}
.fnote{margin:16px 0 0;max-width:56em;font-size:12px;line-height:20px;color:var(--muted)}

/* ---------- 序章：全屏舞台（滚动与刻度尺是同一个量 t） */
.tl{padding:0}
.tlpin{position:relative;height:var(--tl-len,760vh)}
.tlstage{position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));height:calc(100svh - var(--nav-h));min-height:520px;overflow:hidden;background:var(--band-bg)}
.tlmap{position:absolute;inset:0}
.tlmap svg.wmap{position:absolute;inset:0;width:100%;height:100%}
.wmap .dayimg{filter:saturate(.85) brightness(.76)}
.wmap .shade{fill:#030612;opacity:.8}
.wmap .gmt{stroke:var(--accent-ink);stroke-width:1.2;stroke-dasharray:4 4;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .5s var(--ease)}
.wmap .gmt.on{opacity:.85}
.wmap .gmtl{font:600 12px var(--sans);fill:var(--accent-ink);paint-order:stroke;stroke:#05080F;stroke-width:3px;opacity:0;transition:opacity .5s var(--ease)}
.wmap .gmtl.on{opacity:1}
.wmap .ss circle{fill:none;stroke:#FFE2A6;stroke-width:1.2;vector-effect:non-scaling-stroke;opacity:.8}
.wmap .ss text{font:500 12px var(--sans);fill:#FFE2A6;paint-order:stroke;stroke:#05080F;stroke-width:3px;text-anchor:middle}
.wmap .cdot circle.c{fill:#152034;stroke:#EDE6D3;stroke-width:1.1;transition:fill .4s var(--ease),stroke .4s var(--ease)}
.wmap .cdot circle.g{opacity:0;transition:opacity .5s var(--ease)}
.wmap .cdot text{font:500 12px var(--sans);fill:#EDE6D3;text-anchor:middle;paint-order:stroke;stroke:#05080F;stroke-width:3px;transition:fill .4s var(--ease),opacity .3s var(--ease);opacity:0}
.wmap .cdot.lab text{opacity:1}
.wmap .cdot.on circle.c{fill:var(--accent-ink);stroke:#FFF3DA}
.wmap .cdot.on circle.g{opacity:1;animation:lampbreath 3.2s cubic-bezier(.45,0,.55,1) infinite}
.wmap .cdot.on text{fill:var(--accent-ink);font-weight:700}
.wmap .cdot.under{opacity:.3}
@keyframes lampbreath{0%,100%{opacity:1}50%{opacity:.6}}
.tlhud{position:absolute;z-index:3;left:clamp(16px,3vw,40px);top:clamp(16px,2.6vw,32px);width:max-content;max-width:min(560px,52%);padding:16px 24px;border-radius:var(--r);pointer-events:none}
.tlch{display:block;font:600 12px/16px var(--sans);letter-spacing:.12em;color:var(--muted);margin-bottom:12px}
.jk{display:block;font:600 12px/16px var(--sans);letter-spacing:.12em;color:var(--accent)}
.jyear{font:700 60px/1 var(--serif);color:var(--ink);letter-spacing:-.01em;margin-top:8px;white-space:nowrap}
.jyear small{font:500 14px/20px var(--sans);color:var(--ink-2);margin-left:12px;letter-spacing:.04em;vertical-align:middle}
.jt{font:700 24px/32px var(--serif);color:var(--ink);margin-top:8px;min-height:32px}
.tlcard{position:absolute;z-index:4;left:clamp(16px,3vw,40px);bottom:calc(var(--ruler-h) + 24px);width:min(400px,calc(100% - 32px));max-height:calc(100% - var(--ruler-h) - 264px);overflow:hidden;padding:16px 24px;border-radius:var(--r);display:flex;flex-direction:column}
.tlcard>*{flex:none}
.tlcard.fit1 .tlcredit,.tlcard.fit2 .tlph,.tlcard.fit3 .tlbasis{display:none}
.tlcard .swap{transition:opacity .3s var(--ease),transform .3s var(--ease)}
.tlcard.swapping .swap{opacity:0;transform:translateY(8px)}
.tlhd{display:flex;gap:12px;flex-wrap:wrap;font:500 12px/16px var(--sans);letter-spacing:.08em;color:var(--muted)}
.tlno{color:var(--accent);font-weight:700}
.tlbig{margin:12px 0 0;white-space:nowrap}
.tlbig b{font:700 36px/40px var(--serif);color:var(--ink);letter-spacing:-.02em}
.tlbig small{font:500 12px/16px var(--sans);color:var(--muted);margin-left:8px;letter-spacing:.04em}
.tlbasis{font-size:12px;line-height:16px;color:var(--muted);margin:8px 0 12px}
.tltext{font:400 14px/24px var(--sans);color:var(--ink-2);margin:0 0 12px}
.tlchips{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 12px}
.tlchips .chip{padding:0;border:0;border-radius:0;font:500 14px/20px var(--sans);color:var(--accent-ink);background:none}
.tlchips .chip::after{content:" →";opacity:.6}
.tlchips .chip:hover{color:var(--ink)}
.tlph{margin:0;display:flex;flex-direction:column;flex:0 1 auto;min-height:0}
.tlph img{display:block;width:100%;aspect-ratio:16/8;object-fit:cover;border-radius:8px;background:var(--surface);flex:0 1 auto;min-height:96px}
.tlph figcaption{margin-top:8px;font-size:12px;line-height:16px;color:var(--muted);flex:none}
.tlph figcaption .cs{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.tlph figcaption .cr{display:block}
.tlph.none{display:none}
.tlcredit{font-size:12px;line-height:16px;color:var(--muted);margin:8px 0 0}
/* 十二城：日期牌与表盘（右侧玻璃面板，默认展开） */
.tlbandw{position:absolute;z-index:4;right:clamp(16px,3vw,40px);top:clamp(16px,2.6vw,32px);bottom:calc(var(--ruler-h) + 24px);display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.tlbandw>*{pointer-events:auto}
.tlbtn{display:inline-flex;align-items:center;gap:4px;font:500 14px/20px var(--sans);color:var(--ink);padding:8px 16px;border-radius:9999px;cursor:pointer;transition:transform .3s var(--ease),background-color .3s var(--ease)}
.tlbtn:hover{background:rgba(20,30,50,.78)}
.tlbtn:active{transform:scale(.98)}
.tlbtn-c{display:inline-block;width:8px;height:8px;margin-left:8px;border-right:1.5px solid var(--ink-2);border-bottom:1.5px solid var(--ink-2);transform:translateY(-2px) rotate(45deg);transition:transform .5s var(--ease)}
.tlbtn[aria-expanded="true"] .tlbtn-c{transform:translateY(2px) rotate(-135deg)}
.tlplates{width:384px;min-height:0;overflow-y:auto;scrollbar-width:thin;padding:8px 12px 12px;border-radius:var(--r);transform-origin:100% 0;animation:mat .5s var(--ease)}
.tlplates[hidden]{display:none}
@keyframes mat{from{opacity:0;transform:scale(.96) translateY(-8px)}to{opacity:1;transform:none}}
.tph{display:grid;grid-template-columns:40px 5em minmax(0,1fr);column-gap:12px;font:500 12px/16px var(--sans);color:var(--muted);padding:4px 4px 8px;border-bottom:1px solid var(--line-2)}
.tpr{display:grid;grid-template-columns:40px 5em minmax(0,1fr);column-gap:12px;align-items:center;padding:4px;border-radius:8px;transition:background-color .3s var(--ease)}
.tpr+.tpr{margin-top:2px}
.tpr .dial{display:block;width:40px;height:40px}
.tpn b{display:block;font:600 14px/20px var(--sans);color:var(--ink);white-space:nowrap}
.tpn span{display:block;font:700 14px/20px var(--serif);color:var(--ink-2);letter-spacing:.02em}
.tpp{min-width:0}
.tpp b{display:block;font:700 14px/20px var(--serif);color:var(--ink);overflow-wrap:anywhere}
.tpp span{display:block;font:400 12px/16px var(--sans);color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.tpr.chg{background:var(--wash-2)}

/* 刻度尺：十四个年份等距排开 */

.rhead{position:absolute;left:0;top:8px;bottom:8px;width:0;will-change:transform;pointer-events:none}
.rhead::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:2px;background:var(--accent-ink);border-radius:1px}
.rhead i{position:absolute;left:-10px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--accent-ink);box-shadow:0 0 0 4px rgba(217,164,65,.22),0 0 20px rgba(217,164,65,.55);transition:transform .3s var(--ease)}

.tlintro{padding:96px 0 48px}

.tlnote{margin:0 auto;padding:24px var(--gut) 48px;max-width:1240px;font-size:12px;line-height:20px;color:var(--muted)}

/* ---------- 第一章主图：新年落在哪个季节 */
.drift{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:32px;align-items:start}

.dsv .cur{stroke:var(--accent-ink);stroke-width:1.6;vector-effect:non-scaling-stroke}
.dsv .curg{stroke:var(--accent);stroke-width:10;stroke-opacity:.14;vector-effect:non-scaling-stroke}
.dsv .curk{fill:var(--accent-ink);stroke:var(--surface);stroke-width:2}
.dsv .cury{font:700 16px var(--serif);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.dsv .pt{fill:var(--accent-ink);stroke:var(--surface);stroke-width:1.5}
.dside{position:sticky;top:calc(var(--nav-h) + 24px)}
.dyr{font:700 30px/36px var(--serif);color:var(--ink);margin:0 0 4px}

.dlist{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}

.dlist button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;padding:8px;border-radius:8px;cursor:pointer;transition:background-color .3s var(--ease)}

.rnote{margin:12px 0 0;font-size:14px;line-height:24px;color:var(--ink-2);max-width:680px}

.nbv{text-align:right;white-space:nowrap}
.nbv b{font:700 16px/24px var(--serif);color:var(--ink)}

/* ---------- 第三章主图：每天差多少（精度阶梯）+ 地球这只钟 */
.ladw{display:grid;grid-template-columns:minmax(0,1fr) 304px;gap:32px;align-items:start}

.lck{font:600 12px/16px var(--sans);letter-spacing:.08em;color:var(--accent-ink);margin:0 0 8px}

.lcv{margin:0 0 16px}

/* ---------- 节点列表：透镜分组（FLIP 补间）+ 行内展开 */
.lwrap{position:relative}
.lensbar{position:sticky;top:var(--nav-h);z-index:8;display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;padding:12px var(--gut);margin:0 calc(var(--gut) * -1) 8px;background:var(--nav-glass);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--glass-line)}
.lensk{font:600 12px/16px var(--sans);color:var(--muted);letter-spacing:.08em}
.lens{position:relative;display:inline-flex;padding:4px;border-radius:9999px;background:var(--surface-2)}
.lens .pill{position:absolute;left:0;top:4px;bottom:4px;width:40px;border-radius:9999px;background:var(--accent);will-change:transform,width}
.lens button{position:relative;z-index:1;font:500 14px/20px var(--sans);padding:6px 16px;border:0;border-radius:9999px;background:transparent;color:var(--ink-2);cursor:pointer;transition:color .3s var(--ease)}

.ldate b{display:block;font:700 18px/24px var(--serif);color:var(--accent-ink);letter-spacing:-.01em}
.ldate small{display:block;font-size:12px;line-height:16px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname{min-width:0}
.lname b{display:block;font:700 18px/28px var(--serif);color:var(--ink)}
.lname small{display:block;font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.lkind{font:500 12px/16px var(--sans);color:var(--accent-ink)}
.lerr{font:500 14px/20px var(--sans);color:var(--ink-2)}
.lthumb{display:block;width:64px;height:48px;overflow:hidden;border-radius:6px;background:var(--surface-2)}
.lthumb img{display:block;width:100%;height:100%;object-fit:cover}
.lthumb.none{background:none}

.nnums div{min-width:0}
.nnums span{display:block;font:500 12px/16px var(--sans);color:var(--muted)}
.nnums b{display:block;font:700 16px/24px var(--serif);color:var(--ink);margin-top:4px;overflow-wrap:anywhere}

.tblwrap{overflow-x:auto}

/* ---------- 动手：工具 */
.tool{margin:96px 0 0;padding:48px 0 0;border-top:1px solid var(--line)}
.tool .hd{padding:0 0 24px;max-width:680px}
.tool .hd .k{display:block;font:600 12px/16px var(--sans);letter-spacing:.12em;color:var(--accent-ink);margin:0 0 12px}
.tool .hd b{display:block;font:700 30px/36px var(--serif)}
.tool .hd p{margin:12px 0 0;font-size:14px;line-height:24px;color:var(--muted)}
.demo{display:flex;flex-direction:column;gap:16px}
.dstage{position:relative;background:var(--surface);padding:16px;border-radius:12px;overflow:hidden}
.dsvg{display:block;width:100%;height:auto}
.dsvg .dt{font:400 12px var(--sans);fill:var(--muted)}
.dsvg .ln{stroke:var(--line);stroke-width:1}.dsvg .ln2{stroke:var(--line-2);stroke-width:1}
.dsvg .o2{fill:none;stroke:var(--ink);stroke-width:1.2}
.dsvg .d{stroke-dasharray:4 4}
.dsvg .a{stroke:var(--accent)}
input[type=range]{accent-color:var(--accent);width:100%}
.frow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.frow input,.frow select{font:500 16px/24px var(--sans);padding:8px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;min-width:0;max-width:100%;transition:border-color .3s var(--ease)}
.frow input:hover,.frow select:hover{border-color:var(--ink-2)}
.frow label{font-size:14px;line-height:20px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.dgo{font:600 14px/20px var(--sans);padding:8px 16px;border:1px solid var(--accent);background:var(--accent);color:#1A1206;cursor:pointer;border-radius:9999px;transition:transform .3s var(--ease),background-color .3s var(--ease),color .3s var(--ease)}
.dgo:hover{background:var(--accent-ink)}
.dgo:active{transform:scale(.98)}
.cvgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.cvcard{background:var(--surface);padding:12px 16px;border-radius:12px;min-width:0}
.cvcard.main{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:4px 24px;align-items:baseline;background:var(--wash)}
.cvh{font:600 12px/16px var(--sans);letter-spacing:.08em;color:var(--accent-ink)}
.cvbig{font:700 16px/24px var(--serif);color:var(--ink);margin:4px 0 8px;overflow-wrap:anywhere}
.cvcard.main .cvbig{font-size:36px;line-height:40px;margin:0}
.cvcard.main .cvs{grid-column:1/-1}
.cvf{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.cvf label{font-size:12px;line-height:16px;color:var(--muted);display:grid;gap:4px}
.cvf input{width:5.2em;font:500 14px/20px var(--sans);padding:4px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px}
.cvgo{font:500 12px/16px var(--sans);padding:6px 10px;border:1px solid var(--accent);background:transparent;color:var(--accent-ink);cursor:pointer;border-radius:9999px;transition:background-color .3s var(--ease)}
.cvgo:hover{background:var(--wash)}
.cvs{font-size:12px;line-height:16px;color:var(--muted);margin-top:8px}
.dsst{display:flex;align-items:center;justify-content:center;min-height:160px}
.dsrow{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center}
.dsc{display:grid;justify-items:center;gap:4px;font-size:12px;line-height:16px;color:var(--muted)}
.dsc b{font:600 14px/20px var(--sans);color:var(--ink)}
.dsc span{font:700 20px/28px var(--serif);color:var(--ink)}
.dsarrow{font:700 20px/28px var(--serif);color:var(--accent-ink);text-align:center}
.tdst .dread div+div b{font:500 14px/24px var(--sans);color:var(--ink-2)}
.lsst{padding:16px 16px 8px}
.lsbar{position:relative;height:56px;border-bottom:1px solid var(--ink-2);margin:24px 8px 32px}
.lsbar .axis span{position:absolute;top:100%;transform:translateX(-50%);font-size:12px;line-height:16px;color:var(--muted);margin-top:4px}
.lsbar i{position:absolute;bottom:0;width:2px;height:24px;background:var(--line);margin-left:-1px}
.lsbar i.me{background:var(--accent);height:36px}
.lsbar em{position:absolute;top:-16px;font:600 12px/16px var(--sans);color:var(--accent-ink);font-style:normal;transform:translateX(-100%);white-space:nowrap}
.lsbar u{position:absolute;bottom:0;height:56px;border-left:2px solid var(--ink);font:500 12px/16px var(--sans);text-decoration:none;color:var(--ink);padding-left:4px;white-space:nowrap}
.lslist{columns:4;column-gap:24px;list-style:none;margin:16px 0 0;padding:0;font-size:12px;line-height:24px;color:var(--muted)}
.lslist li span{display:inline-block;width:2em;color:var(--line);font-weight:700}
.lslist li.me{color:var(--ink)}
.lslist li.me span{color:var(--accent-ink)}

/* ---------- 折叠：一条细线 + 加号，不做框 */
details.fold{margin:16px 0 0;border-top:1px solid var(--line)}
details.fold>summary{cursor:pointer;list-style:none;padding:12px 0;font:500 14px/20px var(--sans);color:var(--ink-2);display:flex;align-items:center;gap:12px;transition:color .3s var(--ease)}
details.fold>summary:hover{color:var(--ink)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"+";font:600 16px/1 var(--sans);color:var(--accent);width:16px;flex:none;text-align:center}
details.fold[open]>summary::before{content:"−"}
details.fold>summary h3{margin:0;font-size:20px;line-height:28px;display:inline}
details.fold.big>summary{padding:16px 0}
details.fold.big>summary h3{font-size:24px;line-height:32px}
details.fold>:not(summary){padding:0 0 16px}
details.fold.big>:not(summary){padding:0 0 24px}

/* ---------- 卷末 */
.endm{padding:96px 0 64px}
.endm h2{font-size:48px;line-height:56px;margin-bottom:40px}
.endh{font-size:24px;line-height:32px;margin:0 0 24px}
.endh small{display:block;font:400 14px/24px var(--sans);color:var(--muted);margin-top:4px;letter-spacing:0}
.rlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 48px;margin:0 0 48px}
.ritem{display:grid;grid-template-columns:5em minmax(0,1fr);gap:4px 16px;padding:16px 0 24px;border-top:1px solid var(--line)}
.ritem .ry{font:700 14px/24px var(--serif);color:var(--accent-ink)}
.ritem b{display:block;font:700 18px/28px var(--serif);color:var(--ink)}
.ritem p{margin:4px 0 0;color:var(--ink-2);font-size:14px;line-height:24px}
.ritem .rgo{display:inline-block;margin-top:8px;font:500 14px/20px var(--sans);color:var(--accent-ink);text-decoration:none}
.ritem .rgo:hover{color:var(--ink)}
.refs{columns:2;column-gap:48px;font-size:14px;line-height:24px;color:var(--ink-2)}
.refs h3{font-size:16px;line-height:24px;margin:16px 0 8px;break-after:avoid}
.refs ul{margin:0 0 16px;padding-left:16px;break-inside:avoid}
.refs li{margin:0 0 4px;overflow-wrap:anywhere}
.refs a{color:var(--ink-2)}
.method{max-width:680px;font-size:16px;line-height:28px;color:var(--ink-2)}
.method ul{padding-left:20px}
.credits table{border-collapse:collapse;width:100%;font-size:12px;line-height:20px}
.credits td,.credits th{border-bottom:1px solid var(--line-2);padding:8px;text-align:left;vertical-align:top}
.credits th{font-weight:500;color:var(--muted)}
.credits td:first-child{white-space:nowrap;font-weight:700}
.stamp{display:inline-block;margin-top:48px;padding:12px 24px;border:1px solid var(--accent);border-radius:4px;color:var(--accent-ink);font:700 14px/24px var(--serif);letter-spacing:.12em;transform:rotate(-2deg)}

@media (max-width:1100px){
  .lcols,.lhead{grid-template-columns:6.5em minmax(0,2fr) minmax(0,.8fr) minmax(0,1.1fr) 16px}
  .lcols span:nth-child(5),.lthumb{display:none}
  .chead h2{font-size:48px}
  .jyear{font-size:48px}
  .drift,.ladw{grid-template-columns:minmax(0,1fr) 264px;gap:24px}
  .lbody{grid-template-columns:minmax(0,1fr) 220px}
}
@media (max-width:980px){
  .plate{grid-template-columns:minmax(0,1fr);gap:24px}
  .pimg{order:-1}
  .ptext{padding-bottom:0}
  .chead{margin-bottom:64px}
  .rlist{grid-template-columns:minmax(0,1fr)}
  .refs{columns:1}
  .drift,.ladw{grid-template-columns:minmax(0,1fr)}
  .dside{position:static}
  .lcols{display:none}
  .lhead{grid-template-columns:5.5em minmax(0,1fr) 16px;row-gap:4px}
  .ldate{grid-row:1/3;grid-column:1;align-self:start}
  .lname{grid-row:1;grid-column:2}
  .lchev{grid-row:1;grid-column:3;align-self:start;margin-top:8px}
  .lkind,.lerr{grid-column:2;grid-row:2;display:inline}
  .lerr{grid-row:3}
  .lbody,.lbody.nophoto{grid-template-columns:minmax(0,1fr)}
  .lph{max-width:420px}
  .cvgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lslist{columns:3}
  /* 序章舞台：上下叠——地图 / 十二城横条 / 卡片 / 刻度尺 */
  .tlstage{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto auto;background:var(--band-bg)}
  .tlstage>*{min-width:0}
  .tlmap{position:relative;min-height:0;background:#05080F}
  .tlhud{max-width:calc(100% - 32px);padding:12px 16px}
  .tlbandw{position:relative;inset:auto;display:block;pointer-events:auto;min-width:0;order:2}
  .tlcard{order:3}
  .tlruler{order:4}
  .tlbtn{display:none}
  .tlplates,.tlplates[hidden]{display:flex;width:auto;overflow-x:auto;overflow-y:hidden;gap:8px;padding:8px 16px;border-radius:0;border-left:0;border-right:0;box-shadow:none;background:var(--band-surface);-webkit-backdrop-filter:none;backdrop-filter:none;animation:none;scroll-snap-type:x proximity;touch-action:pan-x pan-y;scrollbar-width:none}
  .tlplates::-webkit-scrollbar{display:none}
  .tph,.tpf{display:none}
  .tpr{flex:none;width:156px;grid-template-columns:32px minmax(0,1fr);row-gap:4px;column-gap:8px;padding:8px;background:rgba(237,230,211,.04);scroll-snap-align:start}
  .tpr+.tpr{margin-top:0}
  .tpr .dial{width:32px;height:32px}
  .tpp{grid-column:1/-1}
  .tpp b{font-size:12px;line-height:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
  .tpp span{display:none}
  .tlcard{position:relative;left:auto;right:auto;bottom:auto;width:auto;max-height:none;min-height:200px;margin:0;border-radius:0;border-left:0;border-right:0;box-shadow:none;background:var(--band-surface);-webkit-backdrop-filter:none;backdrop-filter:none;padding:12px 16px}
  .tlph{display:none}
  .tlcredit{display:none}
  .tlruler{position:relative;left:auto;right:auto;bottom:auto;margin:0;border-radius:0;border-left:0;border-right:0;box-shadow:none;background:var(--band-bg);-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (max-width:600px){
  :root{--ruler-h:60px}
  .chap{padding:64px 0 32px}
  .chead{margin-bottom:48px}
  .chead h2{font-size:36px;line-height:40px}
  .chead .lede{font-size:16px;line-height:28px;margin-top:16px}
  .sec{margin-bottom:64px}
  .sech h3{font-size:30px;line-height:36px}
  .tool{margin-top:64px;padding-top:40px}
  .tool .hd b{font-size:24px;line-height:32px}
  .endm{padding:64px 0 48px}
  .endm h2{font-size:36px;line-height:40px}
  .ritem{grid-template-columns:minmax(0,1fr)}
  .tlhud{top:12px;left:12px}
  .tlch{display:none}
  .jyear{font-size:36px}
  .jt{font-size:18px;line-height:28px}
  .tltext{font-size:14px;line-height:24px;margin-bottom:8px}
  .tlbasis{display:none}
  .tlbig b{font-size:30px;line-height:36px}
  .rmark span{display:none}
  .rmark.on span,.rmark.edge span{display:block}
  .lfacts{grid-template-columns:minmax(0,1fr);gap:0 16px}
  .lfacts dt{padding-top:8px}
  .nnums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dread,.rread{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cvgrid{grid-template-columns:minmax(0,1fr)}
  .lslist{columns:2}
  .lens button{padding:6px 12px}
  .nbh,.nbr{grid-template-columns:4.5em minmax(0,1fr) 5.5em;column-gap:8px}
  .nbax i:nth-child(4n+1){visibility:hidden}
  .nbh em{display:none}
  .nbv small{display:none}
  .nbn small{display:none}
  .nslide{grid-template-columns:minmax(0,1fr) auto}
  .nslide>span:first-child{grid-column:1/-1}
}
@media (max-height:820px) and (min-width:981px){
  .tpp span{display:none}
  .tpr{padding:2px 4px}
  .tpr .dial{width:32px;height:32px}
  .tph,.tpr{grid-template-columns:32px 5em minmax(0,1fr)}
}
@media (max-height:760px) and (min-width:981px){
  .tlph{display:none}
}
@media (max-height:640px) and (min-width:981px){
  .tlhud{top:16px}
  .tlch{display:none}
  .jyear{font-size:36px}
  .jt{font-size:20px;line-height:28px;min-height:28px}
  .tpf{display:none}
}
/* 减少透明度：材质改实底 */
@media (prefers-reduced-transparency:reduce){
  .glass{background:#0A101C;-webkit-backdrop-filter:none;backdrop-filter:none}
  .cnav,.lensbar{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
}
/* 高对比 */
@media (prefers-contrast:more){
  .glass{background:#000;border-color:#EDE6D3;-webkit-backdrop-filter:none;backdrop-filter:none}
  .cnav{background:var(--bg);border-bottom-color:var(--ink)}
  .chip,.lens,.rchips button{border-color:var(--ink-2)}
  .lrow,.nbr{border-bottom-color:var(--line)}
  .lgh,.ritem,details.fold,.tool{border-color:var(--ink-2)}
  .dsv .cal{stroke-opacity:1}
}
/* 减少动效：全局保险丝先把动画缩到 0.01 ms、停掉循环，再留住颜色与透明度的短渐变 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .fade,.rise{opacity:1;transform:none}
  .h3img img{animation:none;transform:none}
  .tagsec{height:auto}.tagstick{position:static;height:auto;padding:96px 0}.tagl .w{color:#EDE6D3;animation:none}.tagrest{opacity:1;transform:none}
  .tlcard .swap{transition:opacity .2s ease!important;transform:none!important}
}
@media print{.cnav,.tlruler,.ntheme{display:none}.fade,.rise{opacity:1;transform:none}.tagsec{height:auto}.tagstick{position:static;height:auto}.tagl .w{color:#EDE6D3}.tagrest{opacity:1;transform:none}.tlpin{height:auto!important}.tlstage{position:relative;height:70vh}}
</style>
