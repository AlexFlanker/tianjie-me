<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="三本书的一次合读：《架构整洁之道》《AI 工程》《智能简史》听书节目，三个声音版本可选，章节跳转。">
<meta property="og:title" content="三本书的一次合读 · 听书">
<meta property="og:description" content="当 AI 让你能做更多事之后——三本书的综合听书，约 25 分钟。">
<meta property="og:url" content="https://tianjie.me/listen/">
<meta property="og:image" content="https://tianjie.me/listen/cover.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2213%22 fill=%22%231f5f63%22/%3E%3Cpath d=%22M12 10v12l10-6z%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<title>三本书的一次合读 · 听书 — 天杰</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* Layout: one centered column — cover, title, transport, then two compact lists (声音版本 / 章节). Quiet paper surface, one deep teal accent. */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --fg:#1b2220; --muted:#6b7673; --line:#dfe4e1;
  --accent:#1f5f63; --accent-soft:#d9e9e8; --track:#e6eae8;
  --display:"Noto Serif SC",Georgia,"Songti SC",serif;
  --body:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111514; --surface:#191e1c; --fg:#e8ecea; --muted:#8d9894; --line:#2a312e;
  --accent:#7fc2c3; --accent-soft:#1f3334; --track:#262d2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111514; --surface:#191e1c; --fg:#e8ecea; --muted:#8d9894; --line:#2a312e;
  --accent:#7fc2c3; --accent-soft:#1f3334; --track:#262d2a; color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.back{display:block;text-align:center;font-size:13px;color:var(--muted);text-decoration:none;margin-top:6px}.back:hover{color:var(--accent)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:22px}
.cover{width:min(300px,78vw);aspect-ratio:1;max-width:100%;margin:0 auto;border-radius:14px;overflow:hidden;
  box-shadow:0 18px 40px -22px rgba(0,0,0,.45)}
.cover canvas{width:100%;height:100%;display:block}
.meta{text-align:center}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,28px);line-height:1.3;margin:4px 0 2px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.now{font-size:13px;color:var(--accent);margin-top:6px;min-height:1.4em}

.seek{display:grid;gap:6px}
.bar{position:relative;height:28px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.bar .rail{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:var(--track)}
.bar .buf{position:absolute;left:0;height:4px;border-radius:2px;background:var(--accent-soft);width:0}
.bar .fill{position:absolute;left:0;height:4px;border-radius:2px;background:var(--accent);width:0}
.bar .knob{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--accent);left:0;transform:translateX(-50%);
  box-shadow:0 0 0 4px var(--surface);opacity:0;transition:opacity .15s}
.bar:hover .knob,.bar:focus-visible .knob,.bar.drag .knob{opacity:1}
.bar:focus-visible{outline:none}
.bar:focus-visible .rail{box-shadow:0 0 0 2px var(--accent-soft)}
.marks{position:absolute;left:0;right:0;height:4px;pointer-events:none}
.marks i{position:absolute;top:-2px;width:2px;height:8px;background:var(--bg);opacity:.9}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.transport{display:flex;align-items:center;justify-content:center;gap:18px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:999px;display:inline-flex;align-items:center;justify-content:center}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:44px;height:44px;color:var(--fg)}
.ic svg{width:22px;height:22px;fill:currentColor}
.ic:hover{background:var(--accent-soft)}
.ic small{font-size:9px;font-weight:500;position:absolute;bottom:7px;font-variant-numeric:tabular-nums}
.ic{position:relative}
.play{width:64px;height:64px;background:var(--accent);color:var(--bg)}
.play:hover{filter:brightness(1.08);background:var(--accent)}
.play svg{width:28px;height:28px}

.aux{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pill{border:1px solid var(--line);padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums;min-width:52px}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.vol{display:flex;align-items:center;gap:8px}
.vol input{width:90px;accent-color:var(--accent)}

section{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
section h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0;padding:12px 16px 6px}
.list{list-style:none;margin:0;padding:0 6px 6px}
.list li{display:grid;grid-template-columns:28px 1fr auto;align-items:start;gap:10px;padding:10px 10px;border-radius:8px;cursor:pointer;min-width:0}
.list li:hover{background:var(--accent-soft)}
.list li .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;padding-top:2px}
.list li .t{min-width:0;line-height:1.4}
.list li .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.list li .s{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list li.on{background:var(--accent-soft)}
.list li.on .t,.list li.on .n{color:var(--accent);font-weight:500}
.list li.on .n::before{content:"▶";font-size:9px}
.list li.on .n span{display:none}
.hint{text-align:center;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="cover" aria-hidden="true"><canvas id="cv" width="900" height="900"></canvas></div>

  <div class="meta">
    <div class="eyebrow">听书 · 合读</div>
    <h1>三本书的一次合读</h1>
    <div class="sub">当 AI 让你能做更多事之后 · 约 25 分钟</div>
    <div class="now" id="now"></div>
  </div>

  <div class="seek">
    <div class="bar" id="bar" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="rail"></div><div class="buf" id="buf"></div><div class="fill" id="fill"></div>
      <div class="marks" id="marks"></div><div class="knob" id="knob"></div>
    </div>
    <div class="times"><span id="cur">0:00</span><span id="rem">-0:00</span></div>
  </div>

  <div class="transport">
    <button class="ic" id="prev" title="上一集" aria-label="上一集"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="ic" id="back" title="后退 15 秒" aria-label="后退 15 秒"><svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg><small>15</small></button>
    <button class="play" id="play" aria-label="播放">
      <svg id="iplay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="ipause" viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
    <button class="ic" id="fwd" title="前进 30 秒" aria-label="前进 30 秒"><svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/></svg><small>30</small></button>
    <button class="ic" id="next" title="下一集" aria-label="下一集"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
  </div>

  <div class="aux">
    <button class="pill" id="speed" title="播放速度">1.0×</button>
    <label class="vol"><span id="volic">音量</span><input type="range" id="vol" min="0" max="1" step="0.02" value="1" aria-label="音量"></label>
  </div>

  <section>
    <h2>选集 · 声音版本</h2>
    <ul class="list" id="tracks"></ul>
  </section>

  <section>
    <h2>章节</h2>
    <ul class="list" id="chapters"></ul>
  </section>

  <div class="hint">空格 播放/暂停 · ← → 后退/前进 · ↑ ↓ 音量 · 自动记住上次位置</div>
  <a class="back" href="/">← 回到 一周一题</a>
</div>

<audio id="au" preload="metadata"></audio>

<script>
(function(){
const CH=["开场","第一部分 · 先搭房子，再请帮手 ——《架构整洁之道》","第二部分 · 当你造的东西会犯错 ——《AI 工程》","第三部分 · 智能是怎么一层一层长出来的 ——《智能简史》","第四部分 · 把三本书放到一起"];
const TRACKS=[
 {id:"yunjian",title:"云健版（定稿）",sub:"男声 · 偏低、磁性，慢 4%",src:"audio/yunjian.mp3",dur:1483,ch:[0,134,528,887,1237]},
 {id:"xiaoxiao",title:"晓晓版",sub:"女声 · 清晰、播音感",src:"audio/xiaoxiao.mp3",dur:1484,ch:[0,140,538,892,1241]},
 {id:"yunxi",title:"云希版",sub:"男声 · 明亮、讲述感",src:"audio/yunxi.mp3",dur:1422,ch:[0,134,511,852,1190]},
];
const SPEEDS=[0.8,1,1.1,1.25,1.5,1.75,2];
const $=id=>document.getElementById(id);
const au=$("au"),bar=$("bar"),fill=$("fill"),buf=$("buf"),knob=$("knob"),marks=$("marks"),cur=$("cur"),rem=$("rem"),now=$("now");
let ti=0,spd=1,dragging=false;

const store={get(k){try{return JSON.parse(localStorage.getItem("sbhd:"+k))}catch(e){return null}},set(k,v){try{localStorage.setItem("sbhd:"+k,JSON.stringify(v))}catch(e){}}};
const fmt=s=>{s=Math.max(0,Math.floor(s||0));const m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x};
const T=()=>TRACKS[ti];
const dur=()=>isFinite(au.duration)&&au.duration>0?au.duration:T().dur;

/* ---- cover: three translucent layers (认知 / 结构 / 组件) drawn on canvas ---- */
function drawCover(){
  const c=$("cv"),g=c.getContext("2d"),W=c.width,H=c.height;
  const dark=matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.dataset.theme!=="light"||document.documentElement.dataset.theme==="dark";
  const bg=dark?"#15201f":"#e9efed",ink=dark?"#e8ecea":"#1b2220";
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  // soft paper grain
  for(let i=0;i<900;i++){g.fillStyle=dark?"rgba(255,255,255,.025)":"rgba(0,0,0,.03)";g.fillRect(Math.random()*W,Math.random()*H,2,2)}
  // three concentric-but-offset rings, outer=认知 中=结构 内=组件
  const cx=W*.5,cy=H*.46;
  const layers=[{r:330,dx:0,dy:0,col:dark?"rgba(127,194,195,.18)":"rgba(31,95,99,.14)",lw:70},
                {r:235,dx:-28,dy:22,col:dark?"rgba(127,194,195,.32)":"rgba(31,95,99,.26)",lw:70},
                {r:140,dx:18,dy:-14,col:dark?"rgba(127,194,195,.6)":"rgba(31,95,99,.55)",lw:70}];
  g.lineCap="round";
  layers.forEach((L,i)=>{g.beginPath();g.strokeStyle=L.col;g.lineWidth=L.lw;
    const a0=-Math.PI*.62+i*.35,a1=a0+Math.PI*1.55;
    g.arc(cx+L.dx,cy+L.dy,L.r,a0,a1);g.stroke()});
  // core dot
  g.beginPath();g.fillStyle=dark?"#7fc2c3":"#1f5f63";g.arc(cx+18,cy-14,34,0,Math.PI*2);g.fill();
  // text
  g.fillStyle=ink;g.textAlign="center";
  g.font="700 78px 'Noto Serif SC',Georgia,serif";g.fillText("三本书合读",cx,H*.86);
  g.font="500 28px 'Noto Sans SC',system-ui,sans-serif";g.globalAlpha=.65;g.fillText("认知 · 结构 · 组件",cx,H*.92);g.globalAlpha=1;
}
document.fonts&&document.fonts.ready.then(drawCover);drawCover();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",drawCover);
new MutationObserver(drawCover).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

/* ---- lists ---- */
function renderTracks(){
  $("tracks").innerHTML=TRACKS.map((t,i)=>`<li data-i="${i}" class="${i===ti?"on":""}"><span class="n"><span>${i+1}</span></span><span class="t">${t.title}<span class="s">${t.sub}</span></span><span class="d">${fmt(t.dur)}</span></li>`).join("");
}
function renderChapters(){
  const ch=T().ch;
  $("chapters").innerHTML=CH.map((n,i)=>`<li data-c="${i}"><span class="n"><span>${i+1}</span></span><span class="t">${n}</span><span class="d">${fmt(ch[i])}</span></li>`).join("");
  marks.innerHTML=ch.slice(1).map(s=>`<i style="left:${s/T().dur*100}%"></i>`).join("");
}
function curChapter(){const ch=T().ch,t=au.currentTime;let k=0;for(let i=0;i<ch.length;i++)if(t>=ch[i]-.5)k=i;return k}
function hiliteChapter(){const k=curChapter();[...$("chapters").children].forEach((li,i)=>li.classList.toggle("on",i===k));now.textContent=CH[k]}

/* ---- load / play ---- */
function load(i,autoplay){
  ti=(i+TRACKS.length)%TRACKS.length;store.set("track",ti);
  au.src=T().src;au.playbackRate=spd;
  const pos=store.get("pos:"+T().id);
  au.addEventListener("loadedmetadata",()=>{if(pos&&pos<dur()-5)au.currentTime=pos;paint()},{once:true});
  renderTracks();renderChapters();paint();hiliteChapter();
  if(autoplay)au.play().catch(()=>{});
}
function setPlaying(p){$("iplay").hidden=p;$("ipause").hidden=!p;$("play").setAttribute("aria-label",p?"暂停":"播放")}
function paint(){
  const d=dur(),t=au.currentTime||0,p=d?t/d*100:0;
  fill.style.width=p+"%";knob.style.left=p+"%";
  cur.textContent=fmt(t);rem.textContent="-"+fmt(d-t);
  bar.setAttribute("aria-valuenow",Math.round(p));
  if(au.buffered.length){buf.style.width=(au.buffered.end(au.buffered.length-1)/d*100)+"%"}
}

au.addEventListener("timeupdate",()=>{if(!dragging){paint();hiliteChapter()}if(Math.floor(au.currentTime)%3===0)store.set("pos:"+T().id,au.currentTime)});
au.addEventListener("play",()=>setPlaying(true));
au.addEventListener("pause",()=>setPlaying(false));
au.addEventListener("ended",()=>{store.set("pos:"+T().id,0);load(ti+1,true)});
au.addEventListener("progress",paint);

$("play").onclick=()=>au.paused?au.play().catch(()=>{}):au.pause();
$("prev").onclick=()=>{if(au.currentTime>5){au.currentTime=0}else load(ti-1,!au.paused)};
$("next").onclick=()=>load(ti+1,!au.paused);
$("back").onclick=()=>au.currentTime=Math.max(0,au.currentTime-15);
$("fwd").onclick=()=>au.currentTime=Math.min(dur(),au.currentTime+30);
$("speed").onclick=()=>{spd=SPEEDS[(SPEEDS.indexOf(spd)+1)%SPEEDS.length];au.playbackRate=spd;$("speed").textContent=spd.toFixed(spd===1?1:2).replace(/0$/,"")+"×";store.set("speed",spd)};
$("vol").oninput=e=>{au.volume=+e.target.value;au.muted=false;$("volic").textContent=au.volume===0?"静音":"音量";store.set("vol",au.volume)};
$("tracks").onclick=e=>{const li=e.target.closest("li");if(li)load(+li.dataset.i,true)};
$("chapters").onclick=e=>{const li=e.target.closest("li");if(!li)return;au.currentTime=T().ch[+li.dataset.c];if(au.paused)au.play().catch(()=>{});hiliteChapter()};

/* seek bar: pointer + keyboard */
function seekTo(clientX){const r=bar.getBoundingClientRect();const p=Math.min(1,Math.max(0,(clientX-r.left)/r.width));au.currentTime=p*dur();paint();hiliteChapter()}
bar.addEventListener("pointerdown",e=>{dragging=true;bar.classList.add("drag");bar.setPointerCapture(e.pointerId);seekTo(e.clientX)});
bar.addEventListener("pointermove",e=>{if(dragging)seekTo(e.clientX)});
bar.addEventListener("pointerup",e=>{dragging=false;bar.classList.remove("drag")});
bar.addEventListener("pointercancel",()=>{dragging=false;bar.classList.remove("drag")});
bar.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){au.currentTime-=5;e.preventDefault()}if(e.key==="ArrowRight"){au.currentTime+=5;e.preventDefault()}});

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target===bar)return;
  if(e.code==="Space"){e.preventDefault();$("play").click()}
  else if(e.key==="ArrowLeft"){e.preventDefault();$("back").click()}
  else if(e.key==="ArrowRight"){e.preventDefault();$("fwd").click()}
  else if(e.key==="ArrowUp"){e.preventDefault();$("vol").value=Math.min(1,au.volume+.1);$("vol").dispatchEvent(new Event("input"))}
  else if(e.key==="ArrowDown"){e.preventDefault();$("vol").value=Math.max(0,au.volume-.1);$("vol").dispatchEvent(new Event("input"))}
});

/* restore */
const sv=store.get("speed");if(sv&&SPEEDS.includes(sv)){spd=sv;$("speed").textContent=spd.toFixed(spd===1?1:2).replace(/0$/,"")+"×"}
const vv=store.get("vol");if(typeof vv==="number"){au.volume=vv;$("vol").value=vv}
const st=store.get("track");load(typeof st==="number"?st:0,false);
})();
</script>

</body>
</html>
